<!DOCTYPE html>
<html lang="fi">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Helion — Miner</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>
.tx-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
.tx-row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 12px;background:var(--panel-2);border:1px solid var(--line);border-radius:12px;font-size:12px;}
.tx-row .meta{color:var(--muted);font-size:11px;}
.tx-row a{color:var(--gold);text-decoration:none;font-size:11px;}
.hist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hist-head h2{margin:0;}
.btn-sm{border:1px solid var(--line);background:transparent;color:var(--gold);border-radius:999px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:200;align-items:center;justify-content:center;padding:16px;}
.modal-bg.show{display:flex;}
.modal-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(480px,100%);max-height:80vh;overflow:auto;position:relative;}
.modal-x{position:absolute;right:12px;top:12px;border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer;}

.mine-visual{ position:relative; width:min(220px,72vw); margin:18px auto 8px; text-align:center; }
.mine-logo-wrap{
  width:min(160px,52vw); height:min(160px,52vw); margin:0 auto 12px;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 40% 35%, rgba(255,255,255,0.08), transparent 65%);
  border:1px solid rgba(255,255,255,0.1);
  position:relative;
}
.mine-logo-wrap::after{
  content:''; position:absolute; inset:-4px; border-radius:50%;
  border:1px solid transparent;
  border-top-color:rgba(232,185,35,0.45);
  border-right-color:rgba(232,185,35,0.15);
  opacity:0; transition:opacity .3s;
}
.mine-logo-wrap.spinning::after{ opacity:1; animation:mineRing 2.8s linear infinite; }
.mine-logo{
  width:72%; height:72%; object-fit:contain; border-radius:50%;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,0.35));
}
.mine-logo-wrap.spinning .mine-logo{ animation:mineSpin 4.5s linear infinite; }
@keyframes mineSpin{ to{ transform:rotate(360deg); } }
@keyframes mineRing{ to{ transform:rotate(360deg); } }
.mine-meta{ margin-top:4px; }
.mine-meta .time{
  font-family:'JetBrains Mono',monospace; font-size:clamp(22px,6vw,28px);
  font-weight:600; letter-spacing:0.04em; color:var(--text);
}
.mine-meta .label{ font-size:11px; color:var(--muted); margin-top:4px; }
.mine-meta .session{
  margin-top:10px; font-family:'JetBrains Mono',monospace;
  font-size:clamp(16px,4.5vw,20px); font-weight:600; color:var(--gold,#E8B923);
}
.mine-meta .session-lbl{ font-size:11px; color:var(--muted); margin-top:2px; }
.mine-meta .status-badge{ margin-top:10px; display:inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="home.html">
      <img src="logo.jpg" alt="Helion" class="brand-logo" onerror="this.style.display='none'">
      <div><h1 class="display">Helion Miner</h1><div class="tag">BSC Testnet · 12h cycle</div></div>
    </a>
    <div class="user-pill">
      <div class="dot"></div>
      <span id="usernameDisplay">–</span>
      <button type="button" onclick="logout()"><span data-i18n="nav.logout">Kirjaudu ulos</span></button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="home.html" class="nav-item" title="Home" aria-label="Home" data-i18n-title="nav.home"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5.5v-6h-3v6H5a1 1 0 0 1-1-1v-9.5z" fill="rgba(255,255,255,0.08)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg></a>
    <a href="miner.html" class="nav-item active" title="Miner" aria-label="Miner" data-i18n-title="nav.miner"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 4h8l1 3H7l1-3z" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M6 7h12v2.5c0 3.5-2.5 6.5-6 7.5-3.5-1-6-4-6-7.5V7z" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M12 17v3M9 20h6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg></a>
    <a href="staking.html" class="nav-item" title="Staking" aria-label="Staking" data-i18n-title="nav.staking"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35"/><path d="M8 10V8a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><circle cx="12" cy="15" r="1.3" fill="currentColor" opacity="0.8"/></svg></a>
    <a href="helion-trading.html" class="nav-item" title="Swap" aria-label="Swap" data-i18n-title="nav.swap"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 7h11l-2.5-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17H6l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 7v4M6 17v-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/><circle cx="12" cy="12" r="2" fill="rgba(255,255,255,0.08)" stroke="currentColor" stroke-width="1.2"/></svg></a>
    <a href="spot.html" class="nav-item" title="Spot" aria-label="Spot" data-i18n-title="nav.spot"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 16l4.5-5 3.5 3 4-6 4 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16l4.5-5 3.5 3 4-6 4 2V20H4v-4z" fill="rgba(255,255,255,0.05)"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.1" opacity="0.35"/></svg></a>
    <a href="wallet.html" class="nav-item" title="Wallet" aria-label="Wallet" data-i18n-title="nav.wallet"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.1" opacity="0.3"/><circle cx="16.5" cy="14.5" r="1.4" fill="rgba(255,255,255,0.12)" stroke="currentColor" stroke-width="1.15"/></svg></a>
    <a href="leaderboard.html" class="nav-item" title="Board" aria-label="Board" data-i18n-title="nav.board"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3l2.2 4.6L19 8.2l-3.5 3.4.8 4.9L12 14.3 7.7 16.5l.8-4.9L5 8.2l4.8-.6L12 3z" fill="rgba(255,255,255,0.08)" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg></a>
    <a href="guide.html" class="nav-item" title="Guide" aria-label="Guide" data-i18n-title="nav.guide"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 4h9.5A2.5 2.5 0 0 1 18 6.5V20l-6-2.5L6 20V4z" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M9 9h5M9 12h4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" opacity="0.7"/></svg></a>
  </nav>

<div class="card">
    <h1 class="display" data-i18n="nav.miner">Miner</h1>
    <div class="balance-row"><span data-i18n="miner.totalMined">Yhteensä louhittu</span><strong class="mono" id="totalMinedDisplay">–</strong></div>
    <div class="muted" id="minedUsd" style="text-align:right;margin-bottom:8px;">–</div>
    <div class="balance-row"><span>Wallet</span><strong class="mono" id="walletBalance">–</strong></div>
    <div class="muted" id="walletUsd" style="text-align:right;margin-bottom:8px;">–</div>

    <div class="mine-visual">
      <div class="mine-logo-wrap" id="mineLogoWrap">
        <img src="logo.jpg" alt="Helion" class="mine-logo" id="mineLogo" onerror="this.src='logo.png'">
      </div>
      <div class="mine-meta">
        <div class="time" id="gaugeTime">12:00:00</div>
        <div class="label" data-i18n="miner.timeLeft">Kaivos-aika jäljellä</div>
        <div class="session" id="sessionMined">0.00 HEL</div>
        <div class="session-lbl" data-i18n="miner.sessionMined">Tämän syklin kaivaus</div>
        <div class="status-badge" id="gaugeStatus">Ei aktiivinen</div>
      </div>
    </div>

    <div id="emissionBox" class="emission-box" style="display:none;"></div>
    <button class="btn-block" onclick="handleAction()" id="actionBtn" data-i18n="miner.activateBtn">Aktivoi Kaivos (12h)</button>
  </div>

  <div id="alertModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;">
    <div class="card" style="max-width:360px;margin:16px;position:relative;">
      <button type="button" id="alertModalClose" style="position:absolute;right:12px;top:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;">×</button>
      <h2 id="alertModalTitle" class="display">Notice</h2>
      <p id="alertModalBody" class="muted" style="margin:12px 0;"></p>
      <div id="alertModalActions"></div>
    </div>
  </div>


  <div class="card">
    <div class="hist-head">
      <h2 class="display" data-i18n="miner.histTitle">Kaivaushistoria</h2>
      <button type="button" class="btn-sm" onclick="openMineModal()" data-i18n="wallet.txMore">Näytä lisää</button>
    </div>
    <div class="tx-list" id="mineList"><div class="muted">–</div></div>
  </div>

  <div class="modal-bg" id="mineModal" onclick="if(event.target===this)closeMineModal()">
    <div class="modal-card">
      <button type="button" class="modal-x" onclick="closeMineModal()">×</button>
      <h2 class="display" data-i18n="miner.histModalTitle">Mining history</h2>
      <div class="tx-list" id="mineListModal"></div>
    </div>
  </div>

  <div class="foot">Built for the Future. Powered by Helion.</div>
</div>
<div id="toastHost"></div>
<script>
const BACKEND_URL = (window.HELION_CONFIG && window.HELION_CONFIG.BACKEND_URL) || 'https://testnetworkserver.onrender.com';

  const token = localStorage.getItem('helion_token');
  const username = localStorage.getItem('helion_username');
  if (!token || String(token).length < 20) { location.replace('index.html'); }

  let miningInterval = null;
  let miningEndsAt = null;
  let rewardPerCycleNum = 50;
  let rewardPerCycleDisplay = '';
  const MINING_DURATION_MS = 12 * 60 * 60 * 1000;
  const GAUGE_CIRCUMFERENCE = 2 * Math.PI * 96;

  function authHeaders() { return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }; }

  function logout() {
    localStorage.removeItem('helion_token');
    localStorage.removeItem('helion_username');
    window.location.href = 'index.html';
  }

  function toast(message, type = 'default', opts) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    if (opts && opts.html) el.innerHTML = message;
    else el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), opts && opts.html ? 10000 : 5000);
  }

  function apiError(data) {
    const err = new Error((data && data.error) || 'Error');
    if (data) {
      err.code = data.code;
      err.guidePath = data.guidePath;
      err.error = data.error;
      err.errorEn = data.errorEn;
    }
    return err;
  }

  async function apiGet(path) {
    const res = await fetch(BACKEND_URL + path, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw apiError(data);
    return data;
  }
  async function apiPost(path, body) {
    const res = await fetch(BACKEND_URL + path, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body || {}) });
    const data = await res.json();
    if (!res.ok) throw apiError(data);
    return data;
  }

  function closeAlertModal() {
    const ov = document.getElementById('alertModal');
    if (ov) ov.classList.remove('open');
  }

  function showAlertModal({ title, bodyHtml, primaryHref, primaryLabel }) {
    const ov = document.getElementById('alertModal');
    const titleEl = document.getElementById('alertModalTitle');
    const bodyEl = document.getElementById('alertModalBody');
    const actions = document.getElementById('alertModalActions');
    titleEl.textContent = title || (typeof t === 'function' ? t('common.error') : 'Error');
    bodyEl.innerHTML = bodyHtml || '';
    actions.innerHTML = '';
    if (primaryHref) {
      const a = document.createElement('a');
      a.className = 'btn-primary';
      a.href = primaryHref;
      a.textContent = primaryLabel || (typeof t === 'function' ? t('miner.needGasLink') : 'Open guide');
      actions.appendChild(a);
    }
    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'btn-ghost';
    closeBtn.textContent = typeof t === 'function' ? t('common.close') : 'Close';
    closeBtn.onclick = closeAlertModal;
    actions.appendChild(closeBtn);
    ov.classList.add('open');
  }

  document.getElementById('alertModalClose')?.addEventListener('click', closeAlertModal);
  document.getElementById('alertModal')?.addEventListener('click', (ev) => {
    if (ev.target.id === 'alertModal') closeAlertModal();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeAlertModal();
  });

  function showActionError(e) {
    const msg = (typeof apiMsg === 'function') ? apiMsg(e) : (e && (e.errorEn || e.error || e.message));
    const isGas =
      e &&
      (e.code === 'INSUFFICIENT_GAS' ||
        /tBNB-varat|insufficient funds|INSUFFICIENT_GAS|Low tBNB/i.test(String(e.message || msg || '')));

    if (isGas) {
      const href = e.guidePath || 'guide.html#tbnb';
      const body =
        typeof t === 'function'
          ? t('miner.needGas')
          : msg || 'Low tBNB. Fund your Helion wallet.';
      showAlertModal({
        title: typeof t === 'function' ? t('miner.needGasTitle') : 'Low tBNB',
        bodyHtml: body,
        primaryHref: href,
        primaryLabel: typeof t === 'function' ? t('miner.needGasLink') : 'Open guide'
      });
      return;
    }

    showAlertModal({
      title: typeof t === 'function' ? t('common.error') : 'Error',
      bodyHtml: String(msg || (typeof t === 'function' ? t('common.error') : 'Error'))
    });
  }

  function formatTime(ms) {
    if (ms <= 0) return "00:00:00";
    const totalSec = Math.floor(ms / 1000);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function updateGauge() {
    const gaugeTime = document.getElementById('gaugeTime');
    const gaugeStatus = document.getElementById('gaugeStatus');
    const actionBtn = document.getElementById('actionBtn');
    const logoWrap = document.getElementById('mineLogoWrap');
    const sessionEl = document.getElementById('sessionMined');
    const loc = (typeof HelionI18n !== 'undefined' && HelionI18n.getLang && HelionI18n.getLang() === 'en') ? 'en-US' : 'fi-FI';
    const reward = Number(rewardPerCycleNum) || 50;

    function setSession(earned) {
      if (sessionEl) {
        sessionEl.textContent = earned.toLocaleString(loc, { maximumFractionDigits: 4, minimumFractionDigits: 2 }) + ' HEL';
      }
    }

    if (!miningEndsAt) {
      if (gaugeTime) gaugeTime.textContent = '12:00:00';
      if (logoWrap) logoWrap.classList.remove('spinning');
      setSession(0);
      if (gaugeStatus) {
        gaugeStatus.textContent = t('miner.inactive');
        gaugeStatus.className = 'status-badge';
      }
      if (actionBtn) {
        actionBtn.disabled = false;
        actionBtn.textContent = t('miner.activateBtn');
        actionBtn.dataset.mode = 'activate';
      }
      return;
    }

    const remaining = miningEndsAt - Date.now();
    const startedAt = miningEndsAt - MINING_DURATION_MS;
    const elapsed = Math.min(MINING_DURATION_MS, Math.max(0, Date.now() - startedAt));
    const progress = elapsed / MINING_DURATION_MS;
    const sessionEarned = reward * progress;

    if (remaining <= 0) {
      if (gaugeTime) gaugeTime.textContent = '00:00:00';
      if (logoWrap) logoWrap.classList.remove('spinning');
      setSession(reward);
      if (gaugeStatus) {
        gaugeStatus.textContent = t('miner.ready');
        gaugeStatus.className = 'status-badge ready';
      }
      if (actionBtn) {
        actionBtn.disabled = false;
        actionBtn.textContent = ('Claim ' + reward.toLocaleString(loc, { maximumFractionDigits: 2 }) + ' HEL').trim();
        actionBtn.dataset.mode = 'claim';
      }
      clearInterval(miningInterval);
      return;
    }

    if (gaugeTime) gaugeTime.textContent = formatTime(remaining);
    if (logoWrap) logoWrap.classList.add('spinning');
    setSession(sessionEarned);
    if (gaugeStatus) {
      gaugeStatus.textContent = t('miner.mining') || 'Mining…';
      gaugeStatus.className = 'status-badge active';
    }
    if (actionBtn) {
      actionBtn.disabled = true;
      actionBtn.textContent = t('miner.wait') || 'Mining in progress…';
      actionBtn.dataset.mode = 'wait';
    }
  }


  function startGaugeClock() {
    if (miningInterval) clearInterval(miningInterval);
    updateGauge();
    miningInterval = setInterval(updateGauge, 1000);
  }

  let lastHelPrice = 0;

  async function fetchHelPrice() {
    try {
      const res = await fetch(BACKEND_URL + '/api/prices');
      const p = await res.json();
      if (res.ok && p.poolExists) lastHelPrice = p.helUsd;
    } catch (_) {}
    return lastHelPrice;
  }

  function fmtUsdAmt(amt, price) {
    if (!price || !amt) return '–';
    const u = amt * price;
    return '≈ $' + (u < 0.01 ? u.toFixed(6) : u.toLocaleString('en-US', {maximumFractionDigits: 2}));
  }

  async function refreshWallet() {
    try {
      const data = await apiGet('/api/wallet');
      const helAmt = parseFloat(data.helBalance);
      document.getElementById('walletBalance').textContent =
        helAmt.toLocaleString('fi-FI', {maximumFractionDigits: 4}) + ' HEL';
      await fetchHelPrice();
      document.getElementById('walletUsd').textContent = fmtUsdAmt(helAmt, lastHelPrice);
    } catch (e) {
      toast(t('miner.balanceFail') + ': ' + e.message, 'error');
    }
  }

  async function loadStatus() {
    try {
      const data = await apiGet('/api/miner/status');
      miningEndsAt = data.miningEndTime === 0 ? null : data.miningEndTime * 1000;
      rewardPerCycleNum = parseFloat(data.rewardPerCycle);
      if (!isFinite(rewardPerCycleNum) && data.emission && data.emission.scheduledReward) {
        rewardPerCycleNum = parseFloat(data.emission.scheduledReward);
      }
      if (!isFinite(rewardPerCycleNum)) rewardPerCycleNum = 50;
      rewardPerCycleDisplay = rewardPerCycleNum.toLocaleString('fi-FI', {maximumFractionDigits: 2});
      const mined = parseFloat(data.totalMined);
      document.getElementById('totalMinedDisplay').textContent =
        mined.toLocaleString('fi-FI', {maximumFractionDigits: 4}) + ' HEL';
      await fetchHelPrice();
      document.getElementById('minedUsd').textContent = fmtUsdAmt(mined, lastHelPrice);
      const box = document.getElementById('emissionBox');
      if (box && data.emission) {
        const em = data.emission;
        box.style.display = 'block';
        const loc = (typeof HelionI18n !== 'undefined' && HelionI18n.getLang && HelionI18n.getLang() === 'en') ? 'en-US' : 'fi-FI';
        const tt = (k, fb) => (typeof t === 'function' ? t(k) : fb);
        box.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">' + tt('miner.emissionTitle', 'Hybrid emission') + '</div>' +
          '<div><strong>' + tt('miner.emissionSchedule', 'Schedule') + ':</strong> ' + Number(em.scheduledReward).toLocaleString(loc, {maximumFractionDigits: 2}) + ' ' + tt('miner.emissionCycle', 'HEL / cycle') + '</div>' +
          '<div><strong>' + tt('miner.emissionEpoch', 'Epoch') + ':</strong> #' + em.epoch + ' · ½ / ' + em.halvingIntervalDays + ' ' + tt('miner.emissionDays', 'days') + '</div>' +
          '<div><strong>' + tt('miner.emissionNext', 'Next drop') + ':</strong> ' + em.daysToHalving + ' ' + tt('miner.emissionDays', 'days') + '</div>' +
          '<div style="font-size:11px;color:var(--muted);margin-top:8px;">' + tt('miner.emissionNote', '') + '</div>';
      }
    } catch (e) {
      toast(t('miner.statusFail') + ': ' + e.message, 'error');
    }
    startGaugeClock();
  }


  function fmtMineTime(ts) {
    try { return new Date(ts).toLocaleString(undefined, { dateStyle: 'short', timeStyle: 'short' }); }
    catch (e) { return '–'; }
  }

  function renderMineRows(list, host) {
    if (!host) return;
    if (!list || !list.length) {
      host.innerHTML = '<div class="muted">' + (typeof t === 'function' ? t('miner.histEmpty') : 'No mining events yet') + '</div>';
      return;
    }
    var explor = 'https://testnet.bscscan.com/tx/';
    host.innerHTML = list.map(function (ev) {
      var label = ev.type === 'claim' ? 'Claim' : (ev.type === 'activate' ? 'Activate' : (ev.type || 'Mine'));
      var link = ev.txHash ? '<a href="' + explor + ev.txHash + '" target="_blank" rel="noopener">BscScan ↗</a>' : '';
      var hash = ev.txHash ? String(ev.txHash).slice(0, 10) + '…' : '–';
      return '<div class="tx-row"><div><div><strong>' + label + '</strong></div><div class="meta">' + fmtMineTime(ev.ts) + ' · ' + hash + '</div></div><div style="text-align:right">' + link + '</div></div>';
    }).join('');
  }

  async function loadMineHistory(limit, hostId) {
    var host = document.getElementById(hostId);
    if (host) host.innerHTML = '<div class="muted">…</div>';
    try {
      var data = await apiGet('/api/miner/history?limit=' + limit);
      renderMineRows(data.history || [], host);
    } catch (e) {
      if (host) host.innerHTML = '<div class="muted">' + (e.message || 'Failed') + '</div>';
    }
  }

  function openMineModal() {
    var m = document.getElementById('mineModal');
    if (m) m.classList.add('show');
    loadMineHistory(40, 'mineListModal');
  }
  function closeMineModal() {
    var m = document.getElementById('mineModal');
    if (m) m.classList.remove('show');
  }


  async function handleAction() {
    const btn = document.getElementById('actionBtn');
    const mode = btn.dataset.mode;
    if (mode === 'wait') return;

    btn.disabled = true;
    btn.textContent = mode === 'claim' ? t('miner.claiming') : t('miner.activating');
    try {
      if (mode === 'claim') {
        await apiPost('/api/miner/claim');
        toast(t('miner.claimOk'), 'success');
      } else {
        await apiPost('/api/miner/activate');
        toast(t('miner.activateOk'), 'success');
      }
      await loadStatus();
      await refreshWallet();
      await loadMineHistory(3, 'mineList');
    } catch (e) {
      showActionError(e);
      btn.disabled = false;
      updateGauge();
    }
  }

  document.getElementById('usernameDisplay').textContent = '@' + (username || '–');
  refreshWallet();
  loadStatus();
  loadMineHistory(3, 'mineList');
</script>
<script src="i18n.js"></script>

  document.addEventListener('DOMContentLoaded', function() {
    if (window.HelionI18n) {
      HelionI18n.mountLangSwitch(document.body);
      HelionI18n.applyLang();
    }
  });
</script>
