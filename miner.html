<!DOCTYPE html>
<html lang="fi">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helion Miner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0C10; --panel: #14171D; --panel-2: #1B1F27; --line: #262B35;
    --gold: #F2A93B; --violet: #7C5CFC; --text: #F5F3EE; --muted: #8B8F98;
    --danger: #E5484D; --success: #3DD68C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #1a1408 0%, var(--bg) 45%);
    color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh;
    padding: 32px 20px 80px;
  }
  .display{ font-family:'Chakra Petch', sans-serif; }
  .wrap{ max-width: 760px; margin: 0 auto; }

  header{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 16px; }
  .brand{ display:flex; align-items:center; gap: 12px; }
  .brand h1{ font-size: 22px; }
  .brand .tag{ font-size: 11px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 2px;}
  .brand-logo{ height: 40px; width: 40px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); box-shadow:0 0 16px rgba(242,169,59,0.35); }

  .user-pill{ background: var(--panel); border: 1px solid var(--line); padding: 10px 16px; border-radius: 999px; font-size: 13px; display:flex; align-items:center; gap:10px; }
  .user-pill .dot{ width:8px; height:8px; border-radius:50%; background: var(--success); box-shadow: 0 0 8px var(--success); }
  .user-pill button{ background:none; border:none; color:var(--muted); font-size:11.5px; cursor:pointer; text-decoration:underline; }

  .site-nav{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:20px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:6px; }
  .site-nav .nav-item{ flex:1; text-align:center; padding:10px 6px; border-radius:10px; font-size:11.5px; font-weight:600; font-family:'Chakra Petch',sans-serif; color:var(--muted); text-decoration:none; white-space:nowrap; }
  .site-nav .nav-item.active{ background: rgba(242,169,59,0.12); color: var(--gold); }

  .grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px; }
  .card{ background: var(--panel); border:1px solid var(--line); border-radius: 18px; padding: 18px 22px; }
  .card .sub{ font-size: 11.5px; color: var(--muted); margin-bottom:6px; }
  .card .value{ font-size: 22px; font-family:'JetBrains Mono',monospace; font-weight:700; }

  .reactor-card{ background: var(--panel); border: 1px solid var(--line); border-radius: 24px; padding: 36px 24px 28px; display:flex; flex-direction:column; align-items:center; margin-bottom: 20px; position: relative; overflow: hidden; }
  .reactor-card::before{ content:''; position:absolute; inset:0; background: radial-gradient(circle at 50% 0%, rgba(242,169,59,0.08), transparent 60%); pointer-events:none; }
  .gauge-wrap{ position:relative; width: 220px; height: 220px; }
  .gauge-wrap svg{ width:100%; height:100%; transform: rotate(-90deg); }
  .gauge-track{ fill:none; stroke: var(--panel-2); stroke-width: 14; }
  .gauge-fill{ fill:none; stroke: var(--gold); stroke-width: 14; stroke-linecap: round; transition: stroke-dashoffset 1s linear; filter: drop-shadow(0 0 6px rgba(242,169,59,0.6)); }
  .gauge-fill.idle{ stroke: var(--panel-2); filter:none; }
  .gauge-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .gauge-center .time{ font-size: 30px; font-weight: 700; font-family:'JetBrains Mono', monospace; }
  .gauge-center .label{ font-size: 11px; color: var(--muted); text-transform:uppercase; letter-spacing: 1.5px; margin-top: 6px;}
  .gauge-center .status-badge{ margin-top: 10px; font-size: 11px; padding: 4px 10px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .gauge-center .status-badge.active{ background: rgba(242,169,59,0.15); color: var(--gold); }
  .gauge-center .status-badge.ready{ background: rgba(61,214,140,0.15); color: var(--success); }
  .reactor-card .action-row{ margin-top: 24px; width:100%; display:flex; justify-content:center; }

  .btn-block{ width:100%; border:none; padding: 16px; border-radius:14px; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:14px; cursor:pointer; background: linear-gradient(180deg, var(--gold), #d68f26); color:#1a1305; max-width:280px; }
  .btn-block:disabled{ opacity:0.5; cursor:not-allowed; }

  .full-card{ background: var(--panel); border:1px solid var(--line); border-radius:20px; padding:22px; margin-bottom:16px; }

  #toastHost{ position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display:flex; flex-direction:column; gap: 10px; z-index: 100; width: min(90vw, 380px); }
  .toast{ background: var(--panel-2); border:1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .toast.success{ border-color: rgba(61,214,140,0.4); }
  .toast.error{ border-color: rgba(229,72,77,0.4); }

  .modal-overlay{
    display:none; position:fixed; inset:0; z-index:1000;
    background:rgba(0,0,0,0.55); align-items:center; justify-content:center; padding:20px;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    width:min(420px, 100%); background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:20px 22px 18px; box-shadow:0 16px 48px rgba(0,0,0,0.5);
    position:relative;
  }
  .modal-card.error{ border-color: rgba(229,72,77,0.45); }
  .modal-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
  .modal-title{ font-family:'Chakra Petch',sans-serif; font-size:16px; font-weight:700; color:var(--text); }
  .modal-close{
    border:none; background:var(--panel-2); color:var(--muted); width:32px; height:32px;
    border-radius:8px; cursor:pointer; font-size:18px; line-height:1; flex-shrink:0;
  }
  .modal-close:hover{ color:var(--text); }
  .modal-body{ font-size:13.5px; color:var(--muted); line-height:1.5; margin-bottom:16px; }
  .modal-body a{ color:var(--gold); font-weight:600; }
  .modal-actions{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .modal-actions .btn-primary{
    border:none; padding:10px 16px; border-radius:10px; cursor:pointer;
    background:linear-gradient(180deg, var(--gold), #d68f26); color:#1a1305;
    font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13px; text-decoration:none;
  }
  .modal-actions .btn-ghost{
    border:1px solid var(--line); background:transparent; color:var(--muted);
    padding:10px 14px; border-radius:10px; cursor:pointer; font-size:13px;
  }

.helion-lang-switch{display:inline-flex;gap:2px;border:1px solid var(--line,#262B35);border-radius:999px;padding:2px;background:var(--panel,#14171D);margin-left:8px;}
.helion-lang-switch button{border:none;background:transparent;color:var(--muted,#8B8F98);font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;font-family:inherit;}
.helion-lang-switch button.active{background:rgba(242,169,59,0.15);color:var(--gold,#F2A93B);}

</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <img src="logo.jpg" alt="Helion" class="brand-logo">
      <div><h1 class="display" data-i18n="miner.title">Miner</h1><div class="tag">BSC Testnet</div></div>
    </div>
    <div class="user-pill">
      <div class="dot"></div>
      <span id="usernameDisplay">–</span>
      <button onclick="logout()"><span data-i18n="nav.logout">Kirjaudu ulos</span></button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="miner.html" class="nav-item active"><span data-i18n="nav.miner">⛏ Louhinta</span></a>
    <a href="staking.html" class="nav-item"><span data-i18n="nav.staking">🔒 Staking</span></a>
    <a href="helion-trading.html" class="nav-item"><span data-i18n="nav.swap">🔄 Vaihto</span></a>
    <a href="spot.html" class="nav-item"><span data-i18n="nav.spot">📈 Spot</span></a>
    <a href="wallet.html" class="nav-item"><span data-i18n="nav.wallet">💼 Lompakko</span></a>
    <a href="leaderboard.html" class="nav-item"><span data-i18n="nav.board">🏆 Ranking</span></a>
    <a href="guide.html" class="nav-item"><span data-i18n="nav.guide">📖 Ohjeet</span></a>
  </nav>

  <div class="grid">
    <div class="card"><div class="sub" data-i18n="miner.walletBal">Lompakkosaldo</div><div class="value" id="walletBalance">– HEL</div><div style="font-size:11px; color:var(--muted); margin-top:4px;" id="walletUsd">–</div></div>
    <div class="card"><div class="sub" data-i18n="miner.totalMined">Yhteensä louhittu</div><div class="value" id="totalMinedDisplay">– HEL</div><div style="font-size:11px; color:var(--muted); margin-top:4px;" id="minedUsd">–</div></div>
  </div>

  <div class="reactor-card">
    <div class="gauge-wrap">
      <svg viewBox="0 0 220 220">
        <circle class="gauge-track" cx="110" cy="110" r="96"></circle>
        <circle id="gaugeFill" class="gauge-fill idle" cx="110" cy="110" r="96" stroke-dasharray="603.19" stroke-dashoffset="603.19"></circle>
      </svg>
      <div class="gauge-center">
        <div class="time" id="gaugeTime">12:00:00</div>
        <div class="label" data-i18n="miner.timeLeft">Kaivos-aika jäljellä</div>
        <div class="status-badge" id="gaugeStatus">Ei aktiivinen</div>
      </div>
    </div>
    <div class="action-row">
      <button class="btn-block" onclick="handleAction()" id="actionBtn" data-i18n="miner.activateBtn">Aktivoi Kaivos (12h)</button>
    </div>
  </div>
</div>

<div id="toastHost"></div>

<div id="alertModal" class="modal-overlay" role="dialog" aria-modal="true">
  <div class="modal-card error" id="alertModalCard">
    <div class="modal-head">
      <div class="modal-title" id="alertModalTitle">Notice</div>
      <button type="button" class="modal-close" id="alertModalClose" aria-label="Close">×</button>
    </div>
    <div class="modal-body" id="alertModalBody"></div>
    <div class="modal-actions" id="alertModalActions"></div>
  </div>
</div>

<script>
  const BACKEND_URL = (window.HELION_CONFIG && window.HELION_CONFIG.BACKEND_URL) || 'https://testnetworkserver.onrender.com';

  const token = localStorage.getItem('helion_token');
  const username = localStorage.getItem('helion_username');
  if (!token) { window.location.href = 'index.html'; }

  let miningInterval = null;
  let miningEndsAt = null;
  let rewardPerCycleDisplay = '';
  const MINING_DURATION_MS = 12 * 60 * 60 * 1000;
  const GAUGE_CIRCUMFERENCE = 2 * Math.PI * 96;

  function authHeaders() { return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }; }

  function logout() {
    localStorage.removeItem('helion_token');
    localStorage.removeItem('helion_username');
    window.location.href = 'index.html';
  }

  function toast(message, type = 'default', opts) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    if (opts && opts.html) el.innerHTML = message;
    else el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), opts && opts.html ? 10000 : 5000);
  }

  function apiError(data) {
    const err = new Error((data && data.error) || 'Error');
    if (data) {
      err.code = data.code;
      err.guidePath = data.guidePath;
      err.error = data.error;
      err.errorEn = data.errorEn;
    }
    return err;
  }

  async function apiGet(path) {
    const res = await fetch(BACKEND_URL + path, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw apiError(data);
    return data;
  }
  async function apiPost(path, body) {
    const res = await fetch(BACKEND_URL + path, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body || {}) });
    const data = await res.json();
    if (!res.ok) throw apiError(data);
    return data;
  }

  function closeAlertModal() {
    const ov = document.getElementById('alertModal');
    if (ov) ov.classList.remove('open');
  }

  function showAlertModal({ title, bodyHtml, primaryHref, primaryLabel }) {
    const ov = document.getElementById('alertModal');
    const titleEl = document.getElementById('alertModalTitle');
    const bodyEl = document.getElementById('alertModalBody');
    const actions = document.getElementById('alertModalActions');
    titleEl.textContent = title || (typeof t === 'function' ? t('common.error') : 'Error');
    bodyEl.innerHTML = bodyHtml || '';
    actions.innerHTML = '';
    if (primaryHref) {
      const a = document.createElement('a');
      a.className = 'btn-primary';
      a.href = primaryHref;
      a.textContent = primaryLabel || (typeof t === 'function' ? t('miner.needGasLink') : 'Open guide');
      actions.appendChild(a);
    }
    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'btn-ghost';
    closeBtn.textContent = typeof t === 'function' ? t('common.close') : 'Close';
    closeBtn.onclick = closeAlertModal;
    actions.appendChild(closeBtn);
    ov.classList.add('open');
  }

  document.getElementById('alertModalClose')?.addEventListener('click', closeAlertModal);
  document.getElementById('alertModal')?.addEventListener('click', (ev) => {
    if (ev.target.id === 'alertModal') closeAlertModal();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeAlertModal();
  });

  function showActionError(e) {
    const msg = (typeof apiMsg === 'function') ? apiMsg(e) : (e && (e.errorEn || e.error || e.message));
    const isGas =
      e &&
      (e.code === 'INSUFFICIENT_GAS' ||
        /tBNB-varat|insufficient funds|INSUFFICIENT_GAS|Low tBNB/i.test(String(e.message || msg || '')));

    if (isGas) {
      const href = e.guidePath || 'guide.html#tbnb';
      const body =
        typeof t === 'function'
          ? t('miner.needGas')
          : msg || 'Low tBNB. Fund your Helion wallet.';
      showAlertModal({
        title: typeof t === 'function' ? t('miner.needGasTitle') : 'Low tBNB',
        bodyHtml: body,
        primaryHref: href,
        primaryLabel: typeof t === 'function' ? t('miner.needGasLink') : 'Open guide'
      });
      return;
    }

    showAlertModal({
      title: typeof t === 'function' ? t('common.error') : 'Error',
      bodyHtml: String(msg || (typeof t === 'function' ? t('common.error') : 'Error'))
    });
  }

  function formatTime(ms) {
    if (ms <= 0) return "00:00:00";
    const totalSec = Math.floor(ms / 1000);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function updateGauge() {
    const gaugeTime = document.getElementById('gaugeTime');
    const gaugeFill = document.getElementById('gaugeFill');
    const gaugeStatus = document.getElementById('gaugeStatus');
    const actionBtn = document.getElementById('actionBtn');

    if (!miningEndsAt) {
      gaugeTime.textContent = "12:00:00";
      gaugeFill.style.strokeDashoffset = GAUGE_CIRCUMFERENCE;
      gaugeFill.classList.add('idle');
      gaugeStatus.textContent = t("miner.inactive");
      gaugeStatus.className = "status-badge";
      actionBtn.disabled = false;
      actionBtn.textContent = t("miner.activateBtn");
      actionBtn.dataset.mode = "activate";
      return;
    }

    const remaining = miningEndsAt - Date.now();

    if (remaining <= 0) {
      gaugeTime.textContent = "00:00:00";
      gaugeFill.style.strokeDashoffset = 0;
      gaugeFill.classList.remove('idle');
      gaugeStatus.textContent = t("miner.ready");
      gaugeStatus.className = "status-badge ready";
      actionBtn.disabled = false;
      actionBtn.textContent = `Claim ${rewardPerCycleDisplay} HEL`.trim();
      actionBtn.dataset.mode = "claim";
      clearInterval(miningInterval);
      return;
    }

    gaugeTime.textContent = formatTime(remaining);
    const progress = 1 - (remaining / MINING_DURATION_MS);
    gaugeFill.style.strokeDashoffset = GAUGE_CIRCUMFERENCE * (1 - progress);
    gaugeFill.classList.remove('idle');
    gaugeStatus.textContent = t("miner.running");
    gaugeStatus.className = "status-badge active";
    actionBtn.disabled = true;
    actionBtn.textContent = t("miner.runningBtn");
    actionBtn.dataset.mode = "wait";
  }

  function startGaugeClock() {
    if (miningInterval) clearInterval(miningInterval);
    updateGauge();
    miningInterval = setInterval(updateGauge, 1000);
  }

  let lastHelPrice = 0;

  async function fetchHelPrice() {
    try {
      const res = await fetch(BACKEND_URL + '/api/prices');
      const p = await res.json();
      if (res.ok && p.poolExists) lastHelPrice = p.helUsd;
    } catch (_) {}
    return lastHelPrice;
  }

  function fmtUsdAmt(amt, price) {
    if (!price || !amt) return '–';
    const u = amt * price;
    return '≈ $' + (u < 0.01 ? u.toFixed(6) : u.toLocaleString('en-US', {maximumFractionDigits: 2}));
  }

  async function refreshWallet() {
    try {
      const data = await apiGet('/api/wallet');
      const helAmt = parseFloat(data.helBalance);
      document.getElementById('walletBalance').textContent =
        helAmt.toLocaleString('fi-FI', {maximumFractionDigits: 4}) + ' HEL';
      await fetchHelPrice();
      document.getElementById('walletUsd').textContent = fmtUsdAmt(helAmt, lastHelPrice);
    } catch (e) {
      toast(t('miner.balanceFail') + ': ' + e.message, 'error');
    }
  }

  async function loadStatus() {
    try {
      const data = await apiGet('/api/miner/status');
      miningEndsAt = data.miningEndTime === 0 ? null : data.miningEndTime * 1000;
      rewardPerCycleDisplay = parseFloat(data.rewardPerCycle).toLocaleString('fi-FI', {maximumFractionDigits: 2});
      const mined = parseFloat(data.totalMined);
      document.getElementById('totalMinedDisplay').textContent =
        mined.toLocaleString('fi-FI', {maximumFractionDigits: 4}) + ' HEL';
      await fetchHelPrice();
      document.getElementById('minedUsd').textContent = fmtUsdAmt(mined, lastHelPrice);
    } catch (e) {
      toast(t('miner.statusFail') + ': ' + e.message, 'error');
    }
    startGaugeClock();
  }

  async function handleAction() {
    const btn = document.getElementById('actionBtn');
    const mode = btn.dataset.mode;
    if (mode === 'wait') return;

    btn.disabled = true;
    btn.textContent = mode === 'claim' ? t('miner.claiming') : t('miner.activating');
    try {
      if (mode === 'claim') {
        await apiPost('/api/miner/claim');
        toast(t('miner.claimOk'), 'success');
      } else {
        await apiPost('/api/miner/activate');
        toast(t('miner.activateOk'), 'success');
      }
      await loadStatus();
      await refreshWallet();
    } catch (e) {
      showActionError(e);
      btn.disabled = false;
      updateGauge();
    }
  }

  document.getElementById('usernameDisplay').textContent = '@' + (username || '–');
  refreshWallet();
  loadStatus();
</script>
<script src="i18n.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.HelionI18n) {
      var host = document.querySelector('.topbar') || document.querySelector('header') || document.querySelector('.nav') || document.querySelector('.site-nav') || document.body;
      HelionI18n.mountLangSwitch(host);
      HelionI18n.applyLang();
    }
  });
</script>
</body>
</html>
