<!DOCTYPE html>
<html lang="fi">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Helion — Miner</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="home.html">
      <img src="logo.jpg" alt="Helion" class="brand-logo" onerror="this.style.display='none'">
      <div><h1 class="display">Helion Miner</h1><div class="tag">BSC Testnet · 12h cycle</div></div>
    </a>
    <div class="user-pill">
      <div class="dot"></div>
      <span id="usernameDisplay">–</span>
      <button type="button" onclick="logout()"><span data-i18n="nav.logout">Kirjaudu ulos</span></button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="home.html" class="nav-item"><span data-i18n="nav.home">🏠 Home</span></a>
    <a href="miner.html" class="nav-item active"><span data-i18n="nav.miner">⛏ Kaivos</span></a>
    <a href="staking.html" class="nav-item"><span data-i18n="nav.staking">🔒 Staking</span></a>
    <a href="helion-trading.html" class="nav-item"><span data-i18n="nav.swap">🔄 Swap</span></a>
    <a href="spot.html" class="nav-item"><span data-i18n="nav.spot">📈 Spot</span></a>
    <a href="wallet.html" class="nav-item"><span data-i18n="nav.wallet">💼 Lompak</span></a>
    <a href="leaderboard.html" class="nav-item"><span data-i18n="nav.board">🏆 Top</span></a>
    <a href="guide.html" class="nav-item"><span data-i18n="nav.guide">📖 Ohje</span></a>
  </nav>

<div class="card">
    <h1 class="display" data-i18n="nav.miner">Miner</h1>
    <div class="balance-row"><span data-i18n="miner.totalMined">Yhteensä louhittu</span><strong class="mono" id="totalMinedDisplay">–</strong></div>
    <div class="muted" id="minedUsd" style="text-align:right;margin-bottom:8px;">–</div>
    <div class="balance-row"><span>Wallet</span><strong class="mono" id="walletBalance">–</strong></div>
    <div class="muted" id="walletUsd" style="text-align:right;margin-bottom:8px;">–</div>

    <div class="gauge-wrap">
      <svg width="200" height="200" viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="80" fill="none" stroke="#1a1a1a" stroke-width="12"/>
        <circle id="gaugeFill" cx="100" cy="100" r="80" fill="none" stroke="#E8B923" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="502.65" stroke-dashoffset="502.65"
          transform="rotate(-90 100 100)"/>
      </svg>
      <div class="gauge-center">
        <div class="time" id="gaugeTime">12:00:00</div>
        <div class="label" data-i18n="miner.timeLeft">Kaivos-aika jäljellä</div>
        <div class="status-badge" id="gaugeStatus">Ei aktiivinen</div>
      </div>
    </div>

    <div id="emissionBox" class="emission-box" style="display:none;"></div>
    <button class="btn-block" onclick="handleAction()" id="actionBtn" data-i18n="miner.activateBtn">Aktivoi Kaivos (12h)</button>
  </div>

  <div id="alertModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center;">
    <div class="card" style="max-width:360px;margin:16px;position:relative;">
      <button type="button" id="alertModalClose" style="position:absolute;right:12px;top:12px;background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;">×</button>
      <h2 id="alertModalTitle" class="display">Notice</h2>
      <p id="alertModalBody" class="muted" style="margin:12px 0;"></p>
      <div id="alertModalActions"></div>
    </div>
  </div>

  <div class="foot">Built for the Future. Powered by Helion.</div>
</div>
<div id="toastHost"></div>
<script>
const BACKEND_URL = (window.HELION_CONFIG && window.HELION_CONFIG.BACKEND_URL) || 'https://testnetworkserver.onrender.com';

  const token = localStorage.getItem('helion_token');
  const username = localStorage.getItem('helion_username');
  if (!token || String(token).length < 20) { location.replace('index.html'); }

  let miningInterval = null;
  let miningEndsAt = null;
  let rewardPerCycleDisplay = '';
  const MINING_DURATION_MS = 12 * 60 * 60 * 1000;
  const GAUGE_CIRCUMFERENCE = 2 * Math.PI * 96;

  function authHeaders() { return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }; }

  function logout() {
    localStorage.removeItem('helion_token');
    localStorage.removeItem('helion_username');
    window.location.href = 'index.html';
  }

  function toast(message, type = 'default', opts) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    if (opts && opts.html) el.innerHTML = message;
    else el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), opts && opts.html ? 10000 : 5000);
  }

  function apiError(data) {
    const err = new Error((data && data.error) || 'Error');
    if (data) {
      err.code = data.code;
      err.guidePath = data.guidePath;
      err.error = data.error;
      err.errorEn = data.errorEn;
    }
    return err;
  }

  async function apiGet(path) {
    const res = await fetch(BACKEND_URL + path, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw apiError(data);
    return data;
  }
  async function apiPost(path, body) {
    const res = await fetch(BACKEND_URL + path, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body || {}) });
    const data = await res.json();
    if (!res.ok) throw apiError(data);
    return data;
  }

  function closeAlertModal() {
    const ov = document.getElementById('alertModal');
    if (ov) ov.classList.remove('open');
  }

  function showAlertModal({ title, bodyHtml, primaryHref, primaryLabel }) {
    const ov = document.getElementById('alertModal');
    const titleEl = document.getElementById('alertModalTitle');
    const bodyEl = document.getElementById('alertModalBody');
    const actions = document.getElementById('alertModalActions');
    titleEl.textContent = title || (typeof t === 'function' ? t('common.error') : 'Error');
    bodyEl.innerHTML = bodyHtml || '';
    actions.innerHTML = '';
    if (primaryHref) {
      const a = document.createElement('a');
      a.className = 'btn-primary';
      a.href = primaryHref;
      a.textContent = primaryLabel || (typeof t === 'function' ? t('miner.needGasLink') : 'Open guide');
      actions.appendChild(a);
    }
    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'btn-ghost';
    closeBtn.textContent = typeof t === 'function' ? t('common.close') : 'Close';
    closeBtn.onclick = closeAlertModal;
    actions.appendChild(closeBtn);
    ov.classList.add('open');
  }

  document.getElementById('alertModalClose')?.addEventListener('click', closeAlertModal);
  document.getElementById('alertModal')?.addEventListener('click', (ev) => {
    if (ev.target.id === 'alertModal') closeAlertModal();
  });
  document.addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape') closeAlertModal();
  });

  function showActionError(e) {
    const msg = (typeof apiMsg === 'function') ? apiMsg(e) : (e && (e.errorEn || e.error || e.message));
    const isGas =
      e &&
      (e.code === 'INSUFFICIENT_GAS' ||
        /tBNB-varat|insufficient funds|INSUFFICIENT_GAS|Low tBNB/i.test(String(e.message || msg || '')));

    if (isGas) {
      const href = e.guidePath || 'guide.html#tbnb';
      const body =
        typeof t === 'function'
          ? t('miner.needGas')
          : msg || 'Low tBNB. Fund your Helion wallet.';
      showAlertModal({
        title: typeof t === 'function' ? t('miner.needGasTitle') : 'Low tBNB',
        bodyHtml: body,
        primaryHref: href,
        primaryLabel: typeof t === 'function' ? t('miner.needGasLink') : 'Open guide'
      });
      return;
    }

    showAlertModal({
      title: typeof t === 'function' ? t('common.error') : 'Error',
      bodyHtml: String(msg || (typeof t === 'function' ? t('common.error') : 'Error'))
    });
  }

  function formatTime(ms) {
    if (ms <= 0) return "00:00:00";
    const totalSec = Math.floor(ms / 1000);
    const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
    const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
    const s = String(totalSec % 60).padStart(2, '0');
    return `${h}:${m}:${s}`;
  }

  function updateGauge() {
    const gaugeTime = document.getElementById('gaugeTime');
    const gaugeFill = document.getElementById('gaugeFill');
    const gaugeStatus = document.getElementById('gaugeStatus');
    const actionBtn = document.getElementById('actionBtn');

    if (!miningEndsAt) {
      gaugeTime.textContent = "12:00:00";
      gaugeFill.style.strokeDashoffset = GAUGE_CIRCUMFERENCE;
      gaugeFill.classList.add('idle');
      gaugeStatus.textContent = t("miner.inactive");
      gaugeStatus.className = "status-badge";
      actionBtn.disabled = false;
      actionBtn.textContent = t("miner.activateBtn");
      actionBtn.dataset.mode = "activate";
      return;
    }

    const remaining = miningEndsAt - Date.now();

    if (remaining <= 0) {
      gaugeTime.textContent = "00:00:00";
      gaugeFill.style.strokeDashoffset = 0;
      gaugeFill.classList.remove('idle');
      gaugeStatus.textContent = t("miner.ready");
      gaugeStatus.className = "status-badge ready";
      actionBtn.disabled = false;
      actionBtn.textContent = `Claim ${rewardPerCycleDisplay} HEL`.trim();
      actionBtn.dataset.mode = "claim";
      clearInterval(miningInterval);
      return;
    }

    gaugeTime.textContent = formatTime(remaining);
    const progress = 1 - (remaining / MINING_DURATION_MS);
    gaugeFill.style.strokeDashoffset = GAUGE_CIRCUMFERENCE * (1 - progress);
    gaugeFill.classList.remove('idle');
    gaugeStatus.textContent = t("miner.running");
    gaugeStatus.className = "status-badge active";
    actionBtn.disabled = true;
    actionBtn.textContent = t("miner.runningBtn");
    actionBtn.dataset.mode = "wait";
  }

  function startGaugeClock() {
    if (miningInterval) clearInterval(miningInterval);
    updateGauge();
    miningInterval = setInterval(updateGauge, 1000);
  }

  let lastHelPrice = 0;

  async function fetchHelPrice() {
    try {
      const res = await fetch(BACKEND_URL + '/api/prices');
      const p = await res.json();
      if (res.ok && p.poolExists) lastHelPrice = p.helUsd;
    } catch (_) {}
    return lastHelPrice;
  }

  function fmtUsdAmt(amt, price) {
    if (!price || !amt) return '–';
    const u = amt * price;
    return '≈ $' + (u < 0.01 ? u.toFixed(6) : u.toLocaleString('en-US', {maximumFractionDigits: 2}));
  }

  async function refreshWallet() {
    try {
      const data = await apiGet('/api/wallet');
      const helAmt = parseFloat(data.helBalance);
      document.getElementById('walletBalance').textContent =
        helAmt.toLocaleString('fi-FI', {maximumFractionDigits: 4}) + ' HEL';
      await fetchHelPrice();
      document.getElementById('walletUsd').textContent = fmtUsdAmt(helAmt, lastHelPrice);
    } catch (e) {
      toast(t('miner.balanceFail') + ': ' + e.message, 'error');
    }
  }

  async function loadStatus() {
    try {
      const data = await apiGet('/api/miner/status');
      miningEndsAt = data.miningEndTime === 0 ? null : data.miningEndTime * 1000;
      rewardPerCycleDisplay = parseFloat(data.rewardPerCycle).toLocaleString('fi-FI', {maximumFractionDigits: 2});
      const mined = parseFloat(data.totalMined);
      document.getElementById('totalMinedDisplay').textContent =
        mined.toLocaleString('fi-FI', {maximumFractionDigits: 4}) + ' HEL';
      await fetchHelPrice();
      document.getElementById('minedUsd').textContent = fmtUsdAmt(mined, lastHelPrice);
      const box = document.getElementById('emissionBox');
      if (box && data.emission) {
        const em = data.emission;
        box.style.display = 'block';
        box.innerHTML = '<div style="font-size:12px;color:var(--muted);margin-bottom:6px;">Hybrid emission</div>' +
          '<div><strong>Aikataulu:</strong> ' + Number(em.scheduledReward).toLocaleString('fi-FI', {maximumFractionDigits: 2}) + ' HEL / sykli</div>' +
          '<div><strong>Epoch:</strong> #' + em.epoch + ' · ½ / ' + em.halvingIntervalDays + ' pv</div>' +
          '<div><strong>Seuraava pudotus:</strong> ' + em.daysToHalving + ' pv</div>' +
          '<div style="font-size:11px;color:var(--muted);margin-top:8px;">Palkkio puolittuu 90 pv välein (min 0.5). Mainnet: community-bucket 18% kattona. Ketjupalkkio voi poiketa kunnes kontrakti päivitetään.</div>';
      }
    } catch (e) {
      toast(t('miner.statusFail') + ': ' + e.message, 'error');
    }
    startGaugeClock();
  }

  async function handleAction() {
    const btn = document.getElementById('actionBtn');
    const mode = btn.dataset.mode;
    if (mode === 'wait') return;

    btn.disabled = true;
    btn.textContent = mode === 'claim' ? t('miner.claiming') : t('miner.activating');
    try {
      if (mode === 'claim') {
        await apiPost('/api/miner/claim');
        toast(t('miner.claimOk'), 'success');
      } else {
        await apiPost('/api/miner/activate');
        toast(t('miner.activateOk'), 'success');
      }
      await loadStatus();
      await refreshWallet();
    } catch (e) {
      showActionError(e);
      btn.disabled = false;
      updateGauge();
    }
  }

  document.getElementById('usernameDisplay').textContent = '@' + (username || '–');
  refreshWallet();
  loadStatus();
</script>
<script src="i18n.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.HelionI18n) {
      HelionI18n.mountLangSwitch(document.body);
      HelionI18n.applyLang();
    }
  });
</script>
</body>
</html>
