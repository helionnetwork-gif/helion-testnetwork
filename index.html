<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helion — Kirjaudu</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0C10; --panel: #14171D; --panel-2: #1B1F27; --line: #262B35;
    --gold: #F2A93B; --violet: #7C5CFC; --text: #F5F3EE; --muted: #8B8F98;
    --danger: #E5484D; --success: #3DD68C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #1a1408 0%, var(--bg) 45%);
    color: var(--text); font-family:'Inter',sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .display{ font-family:'Chakra Petch', sans-serif; }
  .wrap{ width:100%; max-width: 400px; }

  .logo-row{ text-align:center; margin-bottom:24px; }
  .logo-row img{ width:88px; height:88px; border-radius:50%; object-fit:cover; border:3px solid var(--gold); box-shadow:0 0 28px rgba(242,169,59,0.4); }
  .logo-row h1{ font-size:22px; margin-top:14px; }
  .logo-row .tag{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; }

  .card{ background: var(--panel); border:1px solid var(--line); border-radius:20px; padding:24px; margin-bottom:16px; }
  .card h2{ font-size:15px; margin-bottom:16px; }

  .input-row{ background: var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:4px 14px; margin-bottom:12px; }
  .input-row input{ background:transparent; border:none; outline:none; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:14px; width:100%; padding:12px 0; }

  .btn-block{ width:100%; border:none; padding:14px; border-radius:12px; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; background:linear-gradient(180deg, var(--gold), #d68f26); color:#1a1305; }
  .btn-block.secondary{ background:linear-gradient(180deg, var(--violet), #5b3fd6); color:#f4f1ff; margin-top:10px; }
  .btn-block:disabled{ opacity:0.5; cursor:not-allowed; }
  .link-btn{ background:none; border:none; color:var(--gold); font-size:12.5px; cursor:pointer; margin-top:12px; display:block; text-align:center; width:100%; }

  .divider{ display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--muted); font-size:11px; text-transform:uppercase; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }

  #toastHost{ position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display:flex; flex-direction:column; gap: 10px; z-index: 100; width: min(90vw, 380px); }
  .toast{ background: var(--panel-2); border:1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .toast.success{ border-color: rgba(61,214,140,0.4); }
  .toast.error{ border-color: rgba(229,72,77,0.4); }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img src="logo.jpg" alt="Helion">
    <h1 class="display">Helion</h1>
    <div class="tag">BSC Testnet</div>
  </div>

  <div class="card">
    <h2 class="display" id="authTitle">Kirjaudu sisään</h2>
    <div class="input-row"><input type="text" id="authUsername" placeholder="Käyttäjänimi"></div>
    <div class="input-row"><input type="password" id="authPassword" placeholder="Salasana"></div>
    <button class="btn-block" onclick="doLogin()" id="loginBtn">Kirjaudu</button>
    <button class="link-btn" onclick="toggleAuthMode()" id="toggleAuthBtn">Ei tiliä? Rekisteröidy</button>

    <div class="divider">tai</div>

    <button class="btn-block secondary" onclick="loginWithWallet()" id="walletLoginBtn">🦊 Kirjaudu lompakolla</button>
    <p style="font-size:11px; color:var(--muted); margin-top:8px; text-align:center;">Vaatii että olet aiemmin linkittänyt lompakon Wallet-osiossa.</p>
  </div>
</div>

<div id="toastHost"></div>

<script>
  // ⚠️ Aseta backendisi julkinen osoite tähän deployn jälkeen
  const BACKEND_URL = "http://localhost:3001";

  let isRegisterMode = false;

  function toast(message, type = 'default') {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('authTitle').textContent = isRegisterMode ? 'Luo tili' : 'Kirjaudu sisään';
    document.getElementById('loginBtn').textContent = isRegisterMode ? 'Rekisteröidy' : 'Kirjaudu';
    document.getElementById('toggleAuthBtn').textContent = isRegisterMode ? 'Onko jo tili? Kirjaudu' : 'Ei tiliä? Rekisteröidy';
  }

  function saveSessionAndRedirect(token, username) {
    localStorage.setItem('helion_token', token);
    localStorage.setItem('helion_username', username);
    window.location.href = 'staking.html';
  }

  async function doLogin() {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!username || !password) { toast('Täytä molemmat kentät.', 'error'); return; }

    const endpoint = isRegisterMode ? '/api/register' : '/api/login';
    try {
      const res = await fetch(BACKEND_URL + endpoint, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) { toast(data.error || 'Virhe.', 'error'); return; }
      toast(isRegisterMode ? 'Tili luotu!' : 'Kirjauduttu sisään!', 'success');
      saveSessionAndRedirect(data.token, data.username);
    } catch (e) {
      toast('Yhteysvirhe: ' + e.message, 'error');
    }
  }

  async function loginWithWallet() {
    if (!window.ethereum) { toast('MetaMask ei löytynyt.', 'error'); return; }
    const btn = document.getElementById('walletLoginBtn');
    btn.disabled = true; btn.textContent = 'Odotetaan MetaMaskia…';
    try {
      const provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send('eth_requestAccounts', []);
      const signer = await provider.getSigner();
      const address = await signer.getAddress();

      const nonceRes = await fetch(BACKEND_URL + '/api/auth/nonce?address=' + address);
      const nonceData = await nonceRes.json();
      if (!nonceRes.ok) { toast(nonceData.error || 'Virhe.', 'error'); return; }

      const signature = await signer.signMessage(nonceData.message);

      const loginRes = await fetch(BACKEND_URL + '/api/auth/wallet-login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address, message: nonceData.message, signature })
      });
      const loginData = await loginRes.json();
      if (!loginRes.ok) { toast(loginData.error || 'Kirjautuminen epäonnistui.', 'error'); return; }

      toast('Kirjauduttu lompakolla!', 'success');
      saveSessionAndRedirect(loginData.token, loginData.username);
    } catch (e) {
      toast('Virhe: ' + (e.reason || e.message), 'error');
    } finally {
      btn.disabled = false; btn.textContent = '🦊 Kirjaudu lompakolla';
    }
  }

  if (localStorage.getItem('helion_token')) {
    window.location.href = 'staking.html';
  }
</script>
</body>
</html>
