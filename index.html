<!DOCTYPE html>
<html lang="fi">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Helion — Kirjaudu</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0C10; --panel: #14171D; --panel-2: #1B1F27; --line: #262B35;
    --gold: #F2A93B; --violet: #7C5CFC; --text: #F5F3EE; --muted: #8B8F98;
    --danger: #E5484D; --success: #3DD68C;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(circle at 50% -10%, #1a1408 0%, var(--bg) 45%);
    color: var(--text); font-family:'Inter',sans-serif; min-height:100vh;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .display{ font-family:'Chakra Petch', sans-serif; }
  .wrap{ width:100%; max-width: 400px; }

  .logo-row{ text-align:center; margin-bottom:24px; }
  .logo-row img{ width:88px; height:88px; border-radius:50%; object-fit:cover; border:3px solid var(--gold); box-shadow:0 0 28px rgba(242,169,59,0.4); }
  .logo-row h1{ font-size:22px; margin-top:14px; }
  .logo-row .tag{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; }

  .card{ background: var(--panel); border:1px solid var(--line); border-radius:20px; padding:24px; margin-bottom:16px; }
  .card h2{ font-size:15px; margin-bottom:16px; }

  .input-row{ background: var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:4px 14px; margin-bottom:12px; }
  .input-row input{ background:transparent; border:none; outline:none; color:var(--text); font-family:'JetBrains Mono',monospace; font-size:14px; width:100%; padding:12px 0; }

  .btn-block{ width:100%; border:none; padding:14px; border-radius:12px; font-family:'Chakra Petch',sans-serif; font-weight:700; font-size:13.5px; cursor:pointer; background:linear-gradient(180deg, var(--gold), #d68f26); color:#1a1305; }
  .btn-block.secondary{ background:linear-gradient(180deg, var(--violet), #5b3fd6); color:#f4f1ff; margin-top:10px; }
  .btn-block:disabled{ opacity:0.5; cursor:not-allowed; }
  .link-btn{ background:none; border:none; color:var(--gold); font-size:12.5px; cursor:pointer; margin-top:12px; display:block; text-align:center; width:100%; }

  .divider{ display:flex; align-items:center; gap:10px; margin:18px 0; color:var(--muted); font-size:11px; text-transform:uppercase; }
  .divider::before, .divider::after{ content:''; flex:1; height:1px; background:var(--line); }

  #toastHost{ position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display:flex; flex-direction:column; gap: 10px; z-index: 100; width: min(90vw, 380px); }
  .toast{ background: var(--panel-2); border:1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
  .toast.success{ border-color: rgba(61,214,140,0.4); }
  .toast.error{ border-color: rgba(229,72,77,0.4); }

  .helion-lang-switch{display:inline-flex;gap:2px;border:1px solid var(--line,#262B35);border-radius:999px;padding:2px;background:var(--panel,#14171D);margin-left:8px;}
  .helion-lang-switch button{border:none;background:transparent;color:var(--muted,#8B8F98);font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;font-family:inherit;}
  .helion-lang-switch button.active{background:rgba(242,169,59,0.15);color:var(--gold,#F2A93B);}

  /* PIN modal */
  #pinModal{
    display:none; position:fixed; inset:0; z-index:200;
    background:rgba(5,6,10,0.72); backdrop-filter:blur(6px);
    align-items:center; justify-content:center; padding:20px;
  }
  #pinModal.open{ display:flex; }
  #pinModal .modal-card{
    width:100%; max-width:400px; background:var(--panel);
    border:1px solid var(--line); border-radius:20px; padding:28px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.55);
  }
  #pinModal .modal-icon{
    width:56px; height:56px; margin:0 auto 14px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:24px;
    background:rgba(242,169,59,0.12); border:1px solid rgba(242,169,59,0.35);
  }
  #pinModal h2{ text-align:center; font-size:18px; margin-bottom:8px; }
  #pinModal .modal-msg{
    text-align:center; font-size:13px; color:var(--muted); line-height:1.55; margin-bottom:16px;
  }
  #pinModal .modal-user{
    text-align:center; font-family:'JetBrains Mono',monospace; font-size:12px;
    color:var(--gold); margin-bottom:16px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <img src="logo.jpg" alt="Helion">
    <h1 class="display">Helion</h1>
    <div class="tag">BSC Testnet</div>
  </div>

  <div class="card">
    <h2 class="display" id="authTitle" data-i18n="index.authLogin">Kirjaudu sisään</h2>
    <div class="input-row"><input type="text" id="authUsername" placeholder="Käyttäjänimi" data-i18n-placeholder="index.username" autocomplete="username"></div>
    <div class="input-row"><input type="password" id="authPassword" placeholder="Salasana" data-i18n-placeholder="index.password" autocomplete="current-password"></div>
    <div class="input-row" id="regPinRow" style="display:none"><input type="password" id="regPin" inputmode="numeric" maxlength="8" placeholder="Create PIN (4–8 digits)" data-i18n-placeholder="index.createPin" autocomplete="new-password"></div>
    <div class="input-row" id="regPin2Row" style="display:none"><input type="password" id="regPin2" inputmode="numeric" maxlength="8" placeholder="Confirm PIN" data-i18n-placeholder="index.confirmPin" autocomplete="new-password"></div>
    <p class="muted" id="authHint" style="font-size:12px;margin:8px 0 0;display:none"></p>
    <button class="btn-block" onclick="doLogin()" id="loginBtn" data-i18n="index.loginBtn">Kirjaudu</button>
    <button class="link-btn" onclick="toggleAuthMode()" id="toggleAuthBtn" data-i18n="index.toggleAuth">Ei tiliä? Rekisteröidy</button>

    <div class="divider" data-i18n="index.or">tai</div>

    <button class="btn-block secondary" onclick="loginWithWallet()" id="walletLoginBtn">🦊 <span data-i18n="index.walletLogin">Kirjaudu lompakolla</span></button>
    <p style="font-size:11px; color:var(--muted); margin-top:8px; text-align:center;" data-i18n="index.walletHintStatic">Vaatii että olet aiemmin linkittänyt lompakon Wallet-osiossa.</p>
  </div>
</div>


<!-- PIN unlock window -->
<div id="pinModal" role="dialog" aria-modal="true" aria-labelledby="pinModalTitle">
  <div class="modal-card">
    <div class="modal-icon">🔐</div>
    <h2 class="display" id="pinModalTitle" data-i18n="index.pinTitle">Enter PIN</h2>
    <p class="modal-msg" id="pinModalMsg" data-i18n="index.pinMsg">
      Enter your PIN to continue.
    </p>
    <div class="modal-user" id="pinModalUser"></div>
    <div class="input-row">
      <input type="password" id="unlockPin" inputmode="numeric" maxlength="8" placeholder="PIN" data-i18n-placeholder="index.pin" autocomplete="one-time-code">
    </div>
    <button type="button" class="btn-block" onclick="doUnlockPin()" id="pinOkBtn" data-i18n="index.pinOk">OK</button>
    <button type="button" class="link-btn" onclick="closePinModal()" data-i18n="index.backLogin">Back to login</button>
  </div>
</div>

<div id="toastHost"></div>

<script>
  const BACKEND_URL = (window.HELION_CONFIG && window.HELION_CONFIG.BACKEND_URL) || 'https://testnetworkserver.onrender.com';

  let isRegisterMode = false;

  function openPinModal(username) {
    window.__pendingPinUser = username || '';
    const modal = document.getElementById('pinModal');
    const userEl = document.getElementById('pinModalUser');
    if (userEl) userEl.textContent = username ? '@' + username : '';
    const inp = document.getElementById('unlockPin');
    if (inp) { inp.value = ''; setTimeout(() => inp.focus(), 150); }
    if (modal) modal.classList.add('open');
  }
  function closePinModal() {
    const modal = document.getElementById('pinModal');
    if (modal) modal.classList.remove('open');
  }
  async function doUnlockPin() {
    const username = window.__pendingPinUser || '';
    const pin = (document.getElementById('unlockPin') || {}).value || '';
    if (!username) { toast('Username missing', 'error'); return; }
    if (!pin || pin.replace(/\D/g, '').length < 4) {
      toast(tr('index.pinRequired', 'Enter your PIN (4–8 digits).'), 'error');
      return;
    }
    const btn = document.getElementById('pinOkBtn');
    if (btn) { btn.disabled = true; }
    try {
      const res = await fetch(BACKEND_URL + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, pin: pin.replace(/\D/g, '') })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        toast(data.errorEn || data.error || 'PIN error', 'error');
        return;
      }
      if (!data.token) {
        toast('No session token', 'error');
        return;
      }
      closePinModal();
      saveSessionAndRedirect(data.token, data.username || username);
    } catch (e) {
      toast(String(e.message || e), 'error');
    } finally {
      if (btn) btn.disabled = false;
    }
  }




  function tr(key, fallback) {
    try {
      if (typeof t === 'function') {
        const v = t(key);
        if (v && v !== key) return v;
      }
    } catch (_) {}
    return fallback || key;
  }

  function toast(message, type = 'default') {
    const host = document.getElementById('toastHost');
    if (!host) { console.warn(message); return; }
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), 5000);
  }

  function toggleAuthMode() {
    isRegisterMode = !isRegisterMode;
    document.getElementById('authTitle').textContent = isRegisterMode
      ? tr('index.authRegister', 'Rekisteröidy')
      : tr('index.authLogin', 'Kirjaudu');
    document.getElementById('loginBtn').textContent = isRegisterMode
      ? tr('index.registerBtn', 'Luo tili')
      : tr('index.loginBtn', 'Kirjaudu');
    document.getElementById('toggleAuthBtn').textContent = isRegisterMode
      ? tr('index.toggleToLogin', 'On jo tili? Kirjaudu')
      : tr('index.toggleToRegister', 'Ei tiliä? Rekisteröidy');
    const pinRow = document.getElementById('pinRow');
    const hint = document.getElementById('authHint');
    const r1 = document.getElementById('regPinRow');
    const r2 = document.getElementById('regPin2Row');
    if (r1) r1.style.display = isRegisterMode ? '' : 'none';
    if (r2) r2.style.display = isRegisterMode ? '' : 'none';

    if (pinRow) pinRow.style.display = isRegisterMode ? 'none' : '';
    if (hint) {
      hint.style.display = isRegisterMode ? '' : 'none';
      hint.textContent = isRegisterMode
        ? tr('index.pinHint', 'Choose a PIN (4–8 digits). You will need it every login.')
        : '';
    }
  }

  function saveSessionAndRedirect(token, username) {
    if (!token || String(token).length < 20) {
      toast(tr('common.error', 'Virhe') + ': token puuttuu vastauksesta', 'error');
      return;
    }
    localStorage.setItem('helion_token', token);
    localStorage.setItem('helion_username', username || '');
    window.location.replace('home.html');
  }

  async function doLogin() {
    const username = document.getElementById('authUsername').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!username || !password) {
      toast(tr('index.fillBoth', 'Täytä molemmat kentät.'), 'error');
      return;
    }

    const btn = document.getElementById('loginBtn');
    const prev = btn.textContent;
    btn.disabled = true;
    btn.textContent = tr('common.loading', 'Ladataan…');

    const pin = (document.getElementById('authPin') || {}).value || '';
    const endpoint = isRegisterMode ? '/api/register' : '/api/login';
    try {
      let body;
      if (isRegisterMode) {
        const p1 = ((document.getElementById('regPin') || {}).value || '').replace(/\D/g, '');
        const p2 = ((document.getElementById('regPin2') || {}).value || '').replace(/\D/g, '');
        if (p1.length < 4 || p1.length > 8) {
          toast(tr('index.pinRequired', 'Create a PIN (4–8 digits).'), 'error');
          return;
        }
        if (p1 !== p2) {
          toast(tr('index.pinMismatch', 'PIN codes do not match.'), 'error');
          return;
        }
        body = { username, password, pin: p1 };
      } else {
        body = { username, password };
      }
      const res = await fetch(BACKEND_URL + endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const msg = (typeof apiMsg === 'function' ? apiMsg(data) : null)
          || data.error || tr('common.error', 'Virhe');
        toast(msg, 'error');
        return;
      }
      if (data.needsPin) {
        openPinModal(data.username || username);
        return;
      }
      toast(
        isRegisterMode
          ? tr('index.toastRegister', 'Tili luotu!')
          : tr('index.toastLogin', 'Kirjauduttu sisään!'),
        'success'
      );
      saveSessionAndRedirect(data.token, data.username);
    } catch (e) {
      toast(
        tr('common.connectionError', 'Yhteysvirhe') +
          ': ' + (e.message || e) +
          ' — jos Render nukahti, odota ~30s ja yritä uudelleen.',
        'error'
      );
    } finally {
      btn.disabled = false;
      btn.textContent = prev;
    }
  }




  async function loginWithWallet() {
    if (!window.ethereum) { toast(tr('index.noMetamask', 'MetaMask ei löytynyt.'), 'error'); return; }
    const btn = document.getElementById('walletLoginBtn');
    btn.disabled = true;
    btn.textContent = tr('common.waitingMetamask', 'Odotetaan MetaMaskia…');
    try {
      const provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send('eth_requestAccounts', []);
      const signer = await provider.getSigner();
      const address = await signer.getAddress();

      const nonceRes = await fetch(BACKEND_URL + '/api/auth/nonce?address=' + address);
      const nonceData = await nonceRes.json();
      if (!nonceRes.ok) {
        toast((typeof apiMsg === 'function' ? apiMsg(nonceData) : null) || nonceData.error || tr('common.error', 'Virhe'), 'error');
        return;
      }

      const signature = await signer.signMessage(nonceData.message);

      const loginRes = await fetch(BACKEND_URL + '/api/auth/wallet-login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ address, message: nonceData.message, signature })
      });
      const loginData = await loginRes.json();
      if (!loginRes.ok) {
        toast((typeof apiMsg === 'function' ? apiMsg(loginData) : null) || loginData.error || tr('index.loginFailed', 'Kirjautuminen epäonnistui.'), 'error');
        return;
      }

      toast(tr('index.toastWallet', 'Kirjauduttu lompakolla!'), 'success');
      saveSessionAndRedirect(loginData.token, loginData.username);
    } catch (e) {
      toast(tr('common.error', 'Virhe') + ': ' + (e.reason || e.message), 'error');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '🦊 <span data-i18n="index.walletLogin">' + tr('index.walletLoginBtn', 'Kirjaudu lompakolla') + '</span>';
    }
  }

  document.getElementById('authPassword')?.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doLogin();
  });

  (function () {
    var tok = localStorage.getItem('helion_token');
    // JWT is long; skip empty / garbage to avoid bounce loops
    if (tok && tok.length > 20 && !/home\.html$/i.test(location.pathname)) {
      window.location.replace('home.html');
    }
  })();
</script>
<script src="i18n.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.HelionI18n) {
      HelionI18n.mountLangSwitch(document.body);
      HelionI18n.applyLang();
    }
  });
</script>
</body>
</html>
