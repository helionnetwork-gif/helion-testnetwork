<!DOCTYPE html>
<html lang="fi">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Helion — Rank</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="home.html">
      <img src="logo.jpg" alt="Helion" class="brand-logo" onerror="this.style.display='none'">
      <div><h1 class="display">Helion Ranking</h1><div class="tag">BSC Testnet · Points</div></div>
    </a>
    <div class="user-pill">
      <div class="dot"></div>
      <span id="usernameDisplay">–</span>
      <button type="button" onclick="logout()"><span data-i18n="nav.logout">Kirjaudu ulos</span></button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="home.html" class="nav-item"><span data-i18n="nav.home">🏠 Home</span></a>
    <a href="miner.html" class="nav-item"><span data-i18n="nav.miner">⛏ Kaivos</span></a>
    <a href="staking.html" class="nav-item"><span data-i18n="nav.staking">🔒 Staking</span></a>
    <a href="helion-trading.html" class="nav-item"><span data-i18n="nav.swap">🔄 Swap</span></a>
    <a href="spot.html" class="nav-item"><span data-i18n="nav.spot">📈 Spot</span></a>
    <a href="wallet.html" class="nav-item"><span data-i18n="nav.wallet">💼 Lompakko</span></a>
    <a href="leaderboard.html" class="nav-item active"><span data-i18n="nav.board">🏆 Top</span></a>
    <a href="guide.html" class="nav-item"><span data-i18n="nav.guide">📖 Ohjeet</span></a>
  </nav>

<div class="card">
    <h1 class="display" data-i18n="nav.board">Leaderboard</h1>
    <p class="muted" style="margin-bottom:14px;">Pisteitä louhinnasta, stakeista, swapista ja siirroista.</p>
    <div class="emission-box">
      <div class="balance-row"><span>Pisteesi</span><strong class="mono" id="myScore">–</strong></div>
      <div class="muted" id="myBreakdown" style="margin-top:8px;font-size:12px;"></div>
    </div>
    <ol class="board" id="boardList"></ol>
  </div>

  <div class="foot">Built for the Future. Powered by Helion.</div>
</div>
<div id="toastHost"></div>
<script>

  const BACKEND_URL = (window.HELION_CONFIG && window.HELION_CONFIG.BACKEND_URL) || 'https://testnetworkserver.onrender.com';
  const token = localStorage.getItem('helion_token');
  const username = localStorage.getItem('helion_username');
  if (!token || String(token).length < 20) location.replace('index.html');

  function authHeaders() { return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }; }
  function logout() {
    localStorage.removeItem('helion_token');
    localStorage.removeItem('helion_username');
    location.replace('index.html');
  }
  function toast(message, type) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }
  document.getElementById('usernameDisplay').textContent = username || '–';

  async function load() {
    try {
      const meRes = await fetch(BACKEND_URL + '/api/contribution', { headers: authHeaders() });
      const me = await meRes.json();
      if (meRes.ok) {
        document.getElementById('myScore').textContent = (me.score != null ? Number(me.score).toFixed(1) : '–');
        document.getElementById('myBreakdown').textContent =
          '⛏ ' + (me.mineCount || 0) + ' · 🔒 ' + (me.stakeVolume || 0) + ' HEL · 🔄 ' + (me.tradeCount || 0) + ' · 📤 ' + (me.sendCount || 0);
      }
    } catch (e) {}
    try {
      const res = await fetch(BACKEND_URL + '/api/leaderboard?limit=20');
      const data = await res.json();
      const list = document.getElementById('boardList');
      list.innerHTML = '';
      const meName = (username || '').toLowerCase();
      (data.leaderboard || []).forEach((row, i) => {
        const li = document.createElement('li');
        if ((row.username || '').toLowerCase() === meName) li.className = 'me';
        li.innerHTML = '<span class="rank">#' + (i + 1) + '</span><span class="user">@' + row.username + '</span><span class="score mono">' + Number(row.score || 0).toFixed(1) + '</span>';
        list.appendChild(li);
      });
    } catch (e) {
      toast('Leaderboard failed: ' + e.message, 'error');
    }
  }
  load();

</script>
<script src="i18n.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.HelionI18n) {
      HelionI18n.mountLangSwitch(document.body);
      HelionI18n.applyLang();
    }
  });
</script>
</body>
</html>
