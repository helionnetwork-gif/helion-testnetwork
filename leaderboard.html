</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="home.html">
      <img src="logo.jpg" alt="Helion" class="brand-logo" onerror="this.style.display='none'">
      <div><h1 class="display">Helion Ranking</h1><div class="tag">BSC Testnet · Points</div></div>
    </a>
    <div class="user-pill">
      <div class="dot"></div>
      <span id="usernameDisplay">–</span>
      <button type="button" onclick="logout()"><span data-i18n="nav.logout">Kirjaudu ulos</span></button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="home.html" class="nav-item" title="Home" aria-label="Home" data-i18n-title="nav.home"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5.5v-6h-3v6H5a1 1 0 0 1-1-1v-9.5z" fill="rgba(255,255,255,0.08)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg></a>
    <a href="miner.html" class="nav-item" title="Miner" aria-label="Miner" data-i18n-title="nav.miner"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 4h8l1 3H7l1-3z" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M6 7h12v2.5c0 3.5-2.5 6.5-6 7.5-3.5-1-6-4-6-7.5V7z" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M12 17v3M9 20h6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg></a>
    <a href="staking.html" class="nav-item" title="Staking" aria-label="Staking" data-i18n-title="nav.staking"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35"/><path d="M8 10V8a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><circle cx="12" cy="15" r="1.3" fill="currentColor" opacity="0.8"/></svg></a>
    <a href="helion-trading.html" class="nav-item" title="Swap" aria-label="Swap" data-i18n-title="nav.swap"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 7h11l-2.5-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17H6l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 7v4M6 17v-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/><circle cx="12" cy="12" r="2" fill="rgba(255,255,255,0.08)" stroke="currentColor" stroke-width="1.2"/></svg></a>
    <a href="spot.html" class="nav-item" title="Spot" aria-label="Spot" data-i18n-title="nav.spot"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 16l4.5-5 3.5 3 4-6 4 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16l4.5-5 3.5 3 4-6 4 2V20H4v-4z" fill="rgba(255,255,255,0.05)"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.1" opacity="0.35"/></svg></a>
    <a href="wallet.html" class="nav-item" title="Wallet" aria-label="Wallet" data-i18n-title="nav.wallet"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.1" opacity="0.3"/><circle cx="16.5" cy="14.5" r="1.4" fill="rgba(255,255,255,0.12)" stroke="currentColor" stroke-width="1.15"/></svg></a>
    <a href="leaderboard.html" class="nav-item active" title="Board" aria-label="Board" data-i18n-title="nav.board"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3l2.2 4.6L19 8.2l-3.5 3.4.8 4.9L12 14.3 7.7 16.5l.8-4.9L5 8.2l4.8-.6L12 3z" fill="rgba(255,255,255,0.08)" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg></a>
    <a href="guide.html" class="nav-item" title="Guide" aria-label="Guide" data-i18n-title="nav.guide"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 4h9.5A2.5 2.5 0 0 1 18 6.5V20l-6-2.5L6 20V4z" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M9 9h5M9 12h4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" opacity="0.7"/></svg></a>
  </nav>

</nav>

  <style>
    .lb-tabs {
      display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px;
    }
    .lb-tabs button {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .lb-tabs button.active {
      color: var(--text);
      border-color: rgba(232,185,35,0.45);
      background: rgba(232,185,35,0.12);
    }
    .lb-grid {
      display: grid; gap: 12px;
    }
    @media (min-width: 720px) {
      .lb-grid.overview { grid-template-columns: 1fr 1fr; }
    }
    .lb-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
    }
    .lb-card h3 {
      font-size: 13px; font-weight: 700; margin: 0 0 10px;
      color: var(--muted); letter-spacing: 0.02em; text-transform: uppercase;
    }
    .board-list { list-style: none; margin: 0; padding: 0; }
    .board-list li {
      display: grid;
      grid-template-columns: 36px 1fr auto;
      gap: 8px; align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }
    .board-list li:last-child { border-bottom: none; }
    .board-list li.me { color: var(--gold, #E8B923); }
    .board-list .rank { color: var(--muted); font-variant-numeric: tabular-nums; }
    .board-list .user { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
    .board-list .score { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
    .my-stats {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
      margin-top: 10px; font-size: 12px; color: var(--muted);
    }
    .my-stats strong { color: var(--text); display: block; font-size: 14px; }
  </style>

  <div class="card" style="margin-top:12px;">
    <div class="label" data-i18n="board.you">Your contribution</div>
    <div class="mono" id="myScore" style="font-size:22px;font-weight:700;margin-top:4px;">–</div>
    <div class="my-stats" id="myBreakdown">
      <div><strong id="stMine">0</strong>Mine cycles</div>
      <div><strong id="stStake">0</strong>Staked now (lifetime vol)</div>
      <div><strong id="stTrade">0</strong>Swap volume</div>
      <div><strong id="stSend">0</strong>Sends</div>
      <div><strong id="stLiq">0</strong>Liquidity HNET</div>
      <div><strong id="stScore">0</strong>Total score</div>
    </div>
  </div>

  <div class="lb-tabs" role="tablist">
    <button type="button" class="active" data-cat="all">Overview</button>
    <button type="button" data-cat="overall">Overall</button>
    <button type="button" data-cat="stake">Stakers</button>
    <button type="button" data-cat="liquidity">Liquidity</button>
    <button type="button" data-cat="trade">Traders</button>
    <button type="button" data-cat="send">Senders</button>
    <button type="button" data-cat="mine">Miners</button>
  </div>

  <div id="boardHost" class="lb-grid overview"></div>

<div id="toastHost"></div>
<script>

  const BACKEND_URL = (window.HELION_CONFIG && window.HELION_CONFIG.BACKEND_URL) || 'https://testnetworkserver.onrender.com';
  const token = localStorage.getItem('helion_token');
  const username = localStorage.getItem('helion_username');
  if (!token || String(token).length < 20) location.replace('index.html');

  function authHeaders() { return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }; }
  function logout() {
    localStorage.removeItem('helion_token');
    localStorage.removeItem('helion_username');
    location.replace('index.html');
  }
  function toast(message, type) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }
  document.getElementById('usernameDisplay').textContent = username || '–';

  const meName = (username || '').toLowerCase();
  let currentCat = 'all';
  const LABELS = {
    overall: 'Overall score',
    stake: 'Top stakers',
    liquidity: 'Top liquidity',
    trade: 'Top traders',
    send: 'Top senders',
    mine: 'Top miners'
  };

  function fmtNum(n) {
    const x = Number(n) || 0;
    if (x >= 1e6) return (x / 1e6).toFixed(2) + 'M';
    if (x >= 1e3) return (x / 1e3).toFixed(1) + 'K';
    return x.toLocaleString(undefined, { maximumFractionDigits: 2 });
  }

  function renderList(rows) {
    if (!rows || !rows.length) {
      return '<ul class="board-list"><li><span class="rank">–</span><span class="user">No data yet</span><span class="score"></span></li></ul>';
    }
    return '<ul class="board-list">' + rows.map(function (row, i) {
      const me = (row.username || '').toLowerCase() === meName ? ' me' : '';
      const disp = row.display != null ? row.display : Number(row.score || 0).toFixed(1);
      return '<li class="' + me + '"><span class="rank">#' + (i + 1) + '</span><span class="user">@' +
        row.username + '</span><span class="score">' + disp + '</span></li>';
    }).join('') + '</ul>';
  }

  function renderBoards(boards) {
    const host = document.getElementById('boardHost');
    host.className = 'lb-grid overview';
    const order = ['overall', 'stake', 'liquidity', 'trade', 'send', 'mine'];
    host.innerHTML = order.map(function (id) {
      const b = boards[id] || { label: LABELS[id], rows: [] };
      return '<div class="lb-card"><h3>' + (b.label || LABELS[id] || id) + '</h3>' +
        renderList(b.rows) + '</div>';
    }).join('');
  }

  function renderSingle(label, rows) {
    const host = document.getElementById('boardHost');
    host.className = 'lb-grid';
    host.innerHTML = '<div class="lb-card"><h3>' + label + '</h3>' + renderList(rows) + '</div>';
  }

  async function loadMe() {
    try {
      const meRes = await fetch(BACKEND_URL + '/api/contribution', { headers: authHeaders() });
      const me = await meRes.json();
      if (!meRes.ok) return;
      document.getElementById('myScore').textContent = me.score != null ? Number(me.score).toFixed(1) : '–';
      document.getElementById('stMine').textContent = me.mineCount || 0;
      // Prefer on-chain current stake; show lifetime volume in score context
      const cur = Number(me.currentStaked);
      const life = Number(me.stakeVolume) || 0;
      document.getElementById('stStake').textContent =
        (Number.isFinite(cur) ? fmtNum(cur) : fmtNum(life)) +
        (life > 0 && Number.isFinite(cur) ? ' (vol ' + fmtNum(life) + ')' : '');
      document.getElementById('stTrade').textContent = fmtNum(me.tradeVolume) + ' (' + (me.tradeCount || 0) + ')';
      document.getElementById('stSend').textContent = (me.sendCount || 0) + ' · ' + fmtNum(me.sendVolume);
      document.getElementById('stLiq').textContent = fmtNum(me.liquidityVolume);
      document.getElementById('stScore').textContent = me.score != null ? Number(me.score).toFixed(1) : '–';
    } catch (e) {}
  }

  async function load() {
    await loadMe();
    try {
      if (currentCat === 'all') {
        const res = await fetch(BACKEND_URL + '/api/leaderboard?category=all&limit=8');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        renderBoards(data.boards || {});
      } else {
        const res = await fetch(BACKEND_URL + '/api/leaderboard?category=' + encodeURIComponent(currentCat) + '&limit=25');
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Failed');
        renderSingle(data.label || LABELS[currentCat] || currentCat, data.leaderboard || []);
      }
    } catch (e) {
      toast('Leaderboard failed: ' + e.message, 'error');
    }
  }

  document.querySelectorAll('.lb-tabs button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.lb-tabs button').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentCat = btn.getAttribute('data-cat') || 'all';
      load();
    });
  });

  load();

</script>
<script src="i18n.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.HelionI18n) {
      HelionI18n.mountLangSwitch(document.body);
      HelionI18n.applyLang();
    }
  });
</script>
</body>
</html>
