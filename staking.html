<!DOCTYPE html>
<html lang="fi">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Helion — Staking</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="home.html">
      <img src="logo.jpg" alt="Helion" class="brand-logo" onerror="this.style.display='none'">
      <div><h1 class="display">Helion Staking</h1><div class="tag">BSC Testnet · Lock HEL</div></div>
    </a>
    <div class="user-pill">
      <div class="dot"></div>
      <span id="usernameDisplay">–</span>
      <button type="button" onclick="logout()"><span data-i18n="nav.logout">Kirjaudu ulos</span></button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="home.html" class="nav-item"><span data-i18n="nav.home">🏠 Home</span></a>
    <a href="miner.html" class="nav-item"><span data-i18n="nav.miner">⛏ Kaivos</span></a>
    <a href="staking.html" class="nav-item active"><span data-i18n="nav.staking">🔒 Staking</span></a>
    <a href="helion-trading.html" class="nav-item"><span data-i18n="nav.swap">🔄 Swap</span></a>
    <a href="spot.html" class="nav-item"><span data-i18n="nav.spot">📈 Spot</span></a>
    <a href="wallet.html" class="nav-item"><span data-i18n="nav.wallet">💼 Lompakko</span></a>
    <a href="leaderboard.html" class="nav-item"><span data-i18n="nav.board">🏆 Top</span></a>
    <a href="guide.html" class="nav-item"><span data-i18n="nav.guide">📖 Ohjeet</span></a>
  </nav>

<div class="card">
    <h1 class="display" data-i18n="nav.staking">Staking</h1>
    <div class="balance-row"><span>HEL</span><strong class="mono" id="walletBalance">–</strong></div>
    <div class="muted" id="walletUsd" style="text-align:right;margin-bottom:8px;">–</div>
    <div class="muted mono" id="walletAddress" style="font-size:11px;word-break:break-all;margin-bottom:12px;">–</div>
    <div class="tiers" id="tiersGrid"></div>
    <p class="muted" id="selectedTierInfo" style="margin-bottom:10px;"></p>
    <div class="input-row"><input type="number" id="stakeAmount" placeholder="HEL määrä" data-i18n-placeholder="wallet.amount"></div>
    <button class="btn-block" id="stakeBtn" onclick="doStake()" data-i18n="staking.stake" disabled>Stake</button>
  </div>
  <div class="card">
    <h2 class="display" data-i18n="staking.positions">Omat staket</h2>
    <div id="positionsList"></div>
  </div>

  <div class="foot">Built for the Future. Powered by Helion.</div>
</div>
<div id="toastHost"></div>
<script>
const BACKEND_URL = (window.HELION_CONFIG && window.HELION_CONFIG.BACKEND_URL) || 'https://testnetworkserver.onrender.com';

  const token = localStorage.getItem('helion_token');
  const username = localStorage.getItem('helion_username');
  if (!token || String(token).length < 20) { location.replace('index.html'); }

  let selectedTierId = null;
  let tiersCache = [];

  function tierLabel(name) {
    const map = { Pika: 'tier.quick', Perus: 'tier.standard', 'Pitkä': 'tier.long', Extra: 'tier.extra' };
    const key = map[name];
    return (key && window.t) ? t(key) : name;
  }


  function authHeaders() { return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }; }

  function logout() {
    localStorage.removeItem('helion_token');
    localStorage.removeItem('helion_username');
    window.location.href = 'index.html';
  }

  function toast(message, type = 'default') {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    host.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }

  function fmtDuration(seconds) {
    const totalSec = Math.max(0, seconds);
    const d = Math.floor(totalSec / 86400);
    const h = Math.floor((totalSec % 86400) / 3600);
    if (d > 0) return `${d}pv ${h}h`;
    const m = Math.floor((totalSec % 3600) / 60);
    return `${h}h ${m}min`;
  }

  async function apiGet(path) {
    const res = await fetch(BACKEND_URL + path, { headers: authHeaders() });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Virhe');
    return data;
  }
  async function apiPost(path, body) {
    const res = await fetch(BACKEND_URL + path, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body || {}) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Virhe');
    return data;
  }

  async function refreshWallet() {
    try {
      const data = await apiGet('/api/wallet');
      const helAmt = parseFloat(data.helBalance);
      document.getElementById('walletBalance').textContent =
        helAmt.toLocaleString('fi-FI', {maximumFractionDigits: 4}) + ' HEL';
      document.getElementById('walletAddress').textContent = data.address;
      try {
        const priceRes = await fetch(BACKEND_URL + '/api/prices');
        const prices = await priceRes.json();
        if (priceRes.ok && prices.poolExists) {
          const usd = helAmt * prices.helUsd;
          document.getElementById('walletUsd').textContent = '≈ $' + (usd < 0.01 ? usd.toFixed(6) : usd.toLocaleString('en-US', {maximumFractionDigits: 2}));
        } else {
          document.getElementById('walletUsd').textContent = '–';
        }
      } catch (_) {}
    } catch (e) {
      toast(t('staking.balanceFail') + ': ' + e.message, 'error');
    }
  }

  async function loadTiers() {
    try {
      const res = await fetch(BACKEND_URL + '/api/staking/tiers');
      const data = await res.json();
      tiersCache = data.tiers.filter(t => t.active);
      renderTiers();
    } catch (e) {
      document.getElementById('tiersGrid').innerHTML = '<div class="empty-note">' + t('staking.tiersFail') + '</div>';
    }
  }

  function renderTiers() {
    const grid = document.getElementById('tiersGrid');
    grid.innerHTML = '';
    tiersCache.forEach(t => {
      const card = document.createElement('div');
      card.className = 'tier-card' + (selectedTierId === t.id ? ' selected' : '');
      card.onclick = () => selectTier(t.id);
      card.innerHTML = `
        <div class="name">${tierLabel(t.name)}</div>
        <div class="duration">${t.lockDurationDays} ${(window.t&&window.t('staking.days'))||'vrk'}</div>
        <div class="reward">+${t.rewardPct.toFixed(2)}% ${(window.t&&window.t('staking.reward'))||'tuotto'}</div>
        <div class="min">Min. ${parseFloat(t.minStake).toLocaleString('fi-FI')} HEL</div>
      `;
      grid.appendChild(card);
    });
  }

  function selectTier(tierId) {
    selectedTierId = tierId;
    renderTiers();
    const tier = tiersCache.find(x => x.id === tierId);
    const tt = window.t || ((k)=>k);
    document.getElementById('selectedTierInfo').textContent =
      `${tt('staking.selected')}: ${tierLabel(tier.name)} · ${tier.lockDurationDays} ${tt('staking.days')} · min ${parseFloat(tier.minStake).toLocaleString()} HEL · ${tt('staking.reward')} ${tier.rewardPct.toFixed(2)}%`;
    const btn = document.getElementById('stakeBtn');
    btn.disabled = false;
    btn.textContent = tt('staking.stake');
  }

  async function doStake() {
    if (selectedTierId === null) { toast(t('staking.chooseBtn'), 'error'); return; }
    const val = document.getElementById('stakeAmount').value;
    if (!val || parseFloat(val) <= 0) { toast(t('staking.enterAmount'), 'error'); return; }

    const btn = document.getElementById('stakeBtn');
    btn.disabled = true; btn.textContent = (window.t && t('common.loading')) || '…';
    try {
      await apiPost('/api/staking/stake', { tierId: selectedTierId, amount: val });
      toast((window.t && t('common.success')) || 'OK', 'success');
      document.getElementById('stakeAmount').value = '';
      await refreshWallet();
      await loadPositions();
    } catch (e) {
      toast((typeof t==='function'?t('common.error'):'Error') + ': ' + e.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = t('staking.stake');
    }
  }

  async function loadPositions() {
    const listEl = document.getElementById('positionsList');
    try {
      const data = await apiGet('/api/staking/positions');
      const active = data.positions.filter(p => !p.withdrawn);
      if (active.length === 0) {
        listEl.innerHTML = '<div class="empty-note">' + t('staking.noActive') + '</div>';
        return;
      }
      const now = Math.floor(Date.now() / 1000);
      listEl.innerHTML = '';
      active.forEach(p => {
        const remaining = p.unlocksAt - now;
        const card = document.createElement('div');
        card.className = 'position-card';
        card.innerHTML = `
          <div class="position-top">
            <div class="position-amount">${parseFloat(p.amount).toLocaleString('fi-FI',{maximumFractionDigits:2})} HEL</div>
            <div class="position-tag ${p.ready ? 'ready' : 'locked'}">${p.ready ? t('staking.readyTag') : t('staking.locked')}</div>
          </div>
          <div style="font-size:11.5px; color:var(--muted); margin-bottom:14px;">
            ${p.ready ? t('staking.lockEnded') : fmtDuration(remaining) + ' ' + t('staking.left')} · ${t('staking.reward')} ${p.rewardPct.toFixed(2)}%
          </div>
          <div class="position-actions">
            ${p.ready
              ? `<button class="btn-withdraw" onclick="handleWithdraw(${p.index})">${t("staking.withdraw")}</button>`
              : `<button class="btn-early" onclick="handleEarlyWithdraw(${p.index})">${t("staking.earlyWithdraw")}</button>`}
          </div>
        `;
        listEl.appendChild(card);
      });
    } catch (e) {
      listEl.innerHTML = '<div class="empty-note">' + t('staking.positionsFail') + '</div>';
    }
  }

  async function handleWithdraw(index) {
    try {
      await apiPost('/api/staking/withdraw', { stakeIndex: index });
      toast('Nosto onnistui!', 'success');
      await refreshWallet();
      await loadPositions();
    } catch (e) {
      toast((typeof t==='function'?t('common.error'):'Error') + ': ' + e.message, 'error');
    }
  }

  async function handleEarlyWithdraw(index) {
    if (!confirm(t('staking.confirmEarly'))) return;
    try {
      await apiPost('/api/staking/early-withdraw', { stakeIndex: index });
      toast(t('staking.earlyOk'), 'success');
      await refreshWallet();
      await loadPositions();
    } catch (e) {
      toast((typeof t==='function'?t('common.error'):'Error') + ': ' + e.message, 'error');
    }
  }

  document.getElementById('usernameDisplay').textContent = '@' + (username || '–');
  loadTiers();
  refreshWallet();
  loadPositions();
</script>
<script src="i18n.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    if (window.HelionI18n) {
      HelionI18n.mountLangSwitch(document.body);
      HelionI18n.applyLang();
    }
  });
</script>
</body>
</html>
