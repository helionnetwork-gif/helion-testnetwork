<div id="toastHost"></div>

<script>
  const BACKEND_URL = (window.HELION_CONFIG && window.HELION_CONFIG.BACKEND_URL) || 'https://testnetworkserver.onrender.com';
  const token = localStorage.getItem('helion_token');
  const username = localStorage.getItem('helion_username');
  // Only bounce to login if token really missing (avoid loops with bad short values)
  if (!token || token.length < 20) {
    try {
      localStorage.removeItem('helion_token');
      localStorage.removeItem('helion_username');
    } catch (e) {}
    if (!/index\.html$/i.test(location.pathname)) {
      location.replace('index.html');
    }
  }

  document.getElementById('usernameDisplay').textContent = username || '–';

  function logout() {
    localStorage.removeItem('helion_token');
    localStorage.removeItem('helion_username');
    location.href = 'index.html';
  }

  function toast(msg, err) {
    const host = document.getElementById('toastHost');
    const el = document.createElement('div');
    el.className = 'toast' + (err ? ' err' : '');
    el.textContent = msg;
    host.appendChild(el);
    setTimeout(() => el.remove(), 4500);
  }

  function fmt(n, d) {
    const x = Number(n);
    if (!isFinite(x)) return '–';
    return x.toLocaleString(undefined, { maximumFractionDigits: d });
  }

  function fmtUsd(n) {
    const x = Number(n);
    if (!isFinite(x) || x <= 0) return '–';
    if (x < 0.01) return '$' + x.toPrecision(3);
    return '$' + x.toLocaleString(undefined, { maximumFractionDigits: 4 });
  }

  async function loadWallet() {
    try {
      const res = await fetch(BACKEND_URL + '/api/wallet', {
        headers: { Authorization: 'Bearer ' + token }
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'wallet');

      const helAmt = parseFloat(data.helBalance) || 0;
      const bnbAmt = parseFloat(data.bnbBalance) || 0;

      document.getElementById('balHel').textContent = fmt(helAmt, 4);
      document.getElementById('balHelLabel').textContent = 'HEL';
      document.getElementById('balBnb').textContent = fmt(bnbAmt, 4) + ' tBNB';
      document.getElementById('walletAddress').textContent = data.address || '–';

      try {
        const priceRes = await fetch(BACKEND_URL + '/api/prices');
        const prices = await priceRes.json();
        if (!priceRes.ok) throw new Error(prices.error || 'prices');

        document.getElementById('priceBnb').textContent = fmtUsd(prices.bnbUsd);
        if (prices.poolExists && prices.helUsd > 0) {
          document.getElementById('priceHel').textContent = fmtUsd(prices.helUsd);
          const c24 = document.getElementById('helChange24');
          if (c24 && prices.change24h && prices.change24h.helUsdPct != null) {
            const p = prices.change24h.helUsdPct;
            c24.textContent = (p >= 0 ? '+' : '') + p.toFixed(2) + '% 24h';
            c24.style.color = p >= 0 ? 'var(--success)' : 'var(--danger)';
          }
          document.getElementById('helUsd').textContent = '≈ ' + fmtUsd(helAmt * prices.helUsd);
        } else {
          document.getElementById('priceHel').textContent = '–';
          document.getElementById('helUsd').textContent = '–';
        }
        document.getElementById('bnbUsd').textContent = prices.bnbUsd > 0
          ? '≈ ' + fmtUsd(bnbAmt * prices.bnbUsd)
          : '–';
      } catch (pe) {
        document.getElementById('priceHel').textContent = '–';
        document.getElementById('priceBnb').textContent = '–';
        document.getElementById('helUsd').textContent = '–';
        document.getElementById('bnbUsd').textContent = '–';
      }
    } catch (e) {
      toast((e && e.message) || 'Failed to load wallet', true);
    }
  }

  loadWallet();
</script>
