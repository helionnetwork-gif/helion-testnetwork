<!DOCTYPE html>
<html lang="en">
<head>
<script src="config.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Helion Admin</title>
<link rel="stylesheet" href="theme.css">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  .admin-grid { display: grid; gap: 12px; }
  .row-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .row-btns button { flex: 1 1 auto; min-width: 120px; }
  pre.log {
    background: var(--panel-2, #14171d);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    overflow: auto;
    max-height: 280px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 13px; }
  .kv span:last-child { font-family: 'JetBrains Mono', monospace; color: var(--gold); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="brand" href="home.html">
      <img src="logo.jpg" alt="Helion" class="brand-logo" onerror="this.style.display='none'">
      <div><h1 class="display">Admin</h1><div class="tag">Testnet controls</div></div>
    </a>
    <div class="user-pill">
      <div class="dot"></div>
      <span id="usernameDisplay">–</span>
      <button type="button" onclick="logout()">Log out</button>
    </div>
  </header>

  <nav class="site-nav">
    <a href="home.html" class="nav-item" title="Home" aria-label="Home" data-i18n-title="nav.home"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20a1 1 0 0 1-1 1h-5.5v-6h-3v6H5a1 1 0 0 1-1-1v-9.5z" fill="rgba(255,255,255,0.08)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/></svg></a>
    <a href="miner.html" class="nav-item" title="Miner" aria-label="Miner" data-i18n-title="nav.miner"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 4h8l1 3H7l1-3z" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M6 7h12v2.5c0 3.5-2.5 6.5-6 7.5-3.5-1-6-4-6-7.5V7z" fill="rgba(255,255,255,0.05)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M12 17v3M9 20h6" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/></svg></a>
    <a href="staking.html" class="nav-item" title="Staking" aria-label="Staking" data-i18n-title="nav.staking"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35"/><path d="M8 10V8a4 4 0 0 1 8 0v2" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><circle cx="12" cy="15" r="1.3" fill="currentColor" opacity="0.8"/></svg></a>
    <a href="helion-trading.html" class="nav-item" title="Swap" aria-label="Swap" data-i18n-title="nav.swap"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M7 7h11l-2.5-2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17H6l2.5 2.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 7v4M6 17v-4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/><circle cx="12" cy="12" r="2" fill="rgba(255,255,255,0.08)" stroke="currentColor" stroke-width="1.2"/></svg></a>
    <a href="spot.html" class="nav-item" title="Spot" aria-label="Spot" data-i18n-title="nav.spot"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 16l4.5-5 3.5 3 4-6 4 2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16l4.5-5 3.5 3 4-6 4 2V20H4v-4z" fill="rgba(255,255,255,0.05)"/><path d="M4 20h16" stroke="currentColor" stroke-width="1.1" opacity="0.35"/></svg></a>
    <a href="wallet.html" class="nav-item" title="Wallet" aria-label="Wallet" data-i18n-title="nav.wallet"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35"/><path d="M3 10h18" stroke="currentColor" stroke-width="1.1" opacity="0.3"/><circle cx="16.5" cy="14.5" r="1.4" fill="rgba(255,255,255,0.12)" stroke="currentColor" stroke-width="1.15"/></svg></a>
    <a href="leaderboard.html" class="nav-item" title="Board" aria-label="Board" data-i18n-title="nav.board"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3l2.2 4.6L19 8.2l-3.5 3.4.8 4.9L12 14.3 7.7 16.5l.8-4.9L5 8.2l4.8-.6L12 3z" fill="rgba(255,255,255,0.08)" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/></svg></a>
    <a href="guide.html" class="nav-item" title="Guide" aria-label="Guide" data-i18n-title="nav.guide"><svg class="nav-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 4h9.5A2.5 2.5 0 0 1 18 6.5V20l-6-2.5L6 20V4z" fill="rgba(255,255,255,0.06)" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M9 9h5M9 12h4" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" opacity="0.7"/></svg></a>
  </nav>

  <div class="card">
    <h2 class="display">Spot ticker</h2>
    <div class="kv" id="tickerBox">
      <span>Symbol</span><span id="tSymbol">–</span>
      <span>Quote</span><span id="tQuote">–</span>
      <span>Price</span><span id="tPrice">–</span>
      <span>Ref mid</span><span id="tRef">–</span>
      <span>Oracle</span><span id="tOracle">–</span>
    </div>
    <div class="row-btns">
      <button class="btn-block secondary" type="button" onclick="loadTicker()">Refresh ticker</button>
    </div>
  </div>

  <div class="card">
    <h2 class="display">Market maker</h2>
    <pre class="log" id="mmStatus">–</pre>
    <div class="row-btns">
      <button class="btn-block" type="button" onclick="mm('start')">Start MM</button>
      <button class="btn-block secondary" type="button" onclick="mm('stop')">Stop MM</button>
      <button class="btn-block secondary" type="button" onclick="loadMm()">Status</button>
    </div>
  </div>

  <div class="card">
    <h2 class="display">Order book</h2>
    <p class="muted" style="font-size:12px;">Clear removes all resting orders. Seed places admin liquidity around mid (USDC mid from env).</p>
    <div class="input-row"><input type="number" id="seedPrice" placeholder="Mid price (optional, default USDC mid)" step="0.0001"></div>
    <div class="row-btns">
      <button class="btn-block secondary" type="button" onclick="clearBook()">Clear book</button>
      <button class="btn-block" type="button" onclick="seedBook()">Seed around mid</button>
    </div>
  </div>

  <div class="card">
    <h2 class="display">Invariants / fees</h2>
    <div class="row-btns">
      <button class="btn-block secondary" type="button" onclick="loadInv()">Invariants</button>
      <button class="btn-block secondary" type="button" onclick="loadFees()">Fees</button>
    </div>
    <pre class="log" id="debugBox">–</pre>
  </div>

  <div class="card">
    <h2 class="display">Grid bot</h2>
    <pre class="log" id="gridStatus">–</pre>
    <div class="row-btns">
      <button class="btn-block" type="button" onclick="grid('start')">Start grid</button>
      <button class="btn-block secondary" type="button" onclick="grid('stop')">Stop grid</button>
      <button class="btn-block secondary" type="button" onclick="loadGrid()">Status</button>
    </div>
  </div>

  <div class="foot">Admin · Helion Testnet</div>
</div>
<div id="toastHost"></div>
<script>
const BACKEND_URL = (window.HELION_CONFIG && window.HELION_CONFIG.BACKEND_URL) || 'https://testnetworkserver.onrender.com';
const token = localStorage.getItem('helion_token');
const username = localStorage.getItem('helion_username');
if (!token || String(token).length < 20) location.replace('index.html');
document.getElementById('usernameDisplay').textContent = '@' + (username || '–');

function authHeaders() {
  return { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token };
}
function logout() {
  localStorage.removeItem('helion_token');
  localStorage.removeItem('helion_username');
  location.href = 'index.html';
}
function toast(msg, type) {
  const host = document.getElementById('toastHost');
  if (!host) { alert(msg); return; }
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

async function api(path, method, body) {
  const res = await fetch(BACKEND_URL + path, {
    method: method || 'GET',
    headers: authHeaders(),
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function loadTicker() {
  try {
    const d = await fetch(BACKEND_URL + '/api/spot/ticker').then(r => r.json());
    document.getElementById('tSymbol').textContent = d.symbol || '–';
    document.getElementById('tQuote').textContent = d.quote || '–';
    document.getElementById('tPrice').textContent = d.price != null ? Number(d.price).toPrecision(6) : '–';
    document.getElementById('tRef').textContent = d.refMid != null ? Number(d.refMid).toPrecision(6) : '–';
    document.getElementById('tOracle').textContent = d.oracle
      ? (Number(d.oracle.price).toPrecision(6) + ' · ' + (d.oracle.source || ''))
      : '–';
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function loadMm() {
  try {
    const d = await api('/api/spot/mm/status');
    document.getElementById('mmStatus').textContent = JSON.stringify(d, null, 2);
  } catch (e) {
    document.getElementById('mmStatus').textContent = e.message;
  }
}
async function mm(action) {
  try {
    const d = await api('/api/spot/mm/' + action, 'POST', {});
    document.getElementById('mmStatus').textContent = JSON.stringify(d, null, 2);
    toast('MM ' + action + ' ok', 'success');
    loadTicker();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function clearBook() {
  if (!confirm('Clear entire order book?')) return;
  try {
    const d = await api('/api/spot/clear-book', 'POST', {});
    toast('Book cleared', 'success');
    document.getElementById('debugBox').textContent = JSON.stringify(d, null, 2);
    loadTicker();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function seedBook() {
  try {
    const price = document.getElementById('seedPrice').value;
    const body = price ? { price: Number(price) } : {};
    const d = await api('/api/spot/seed', 'POST', body);
    toast('Seeded', 'success');
    document.getElementById('debugBox').textContent = JSON.stringify(d, null, 2);
    loadTicker();
  } catch (e) {
    toast(e.message, 'error');
  }
}

async function loadInv() {
  try {
    document.getElementById('debugBox').textContent = JSON.stringify(await api('/api/spot/invariants'), null, 2);
  } catch (e) {
    document.getElementById('debugBox').textContent = e.message;
  }
}
async function loadFees() {
  try {
    document.getElementById('debugBox').textContent = JSON.stringify(await api('/api/spot/fees'), null, 2);
  } catch (e) {
    document.getElementById('debugBox').textContent = e.message;
  }
}

async function loadGrid() {
  try {
    document.getElementById('gridStatus').textContent = JSON.stringify(await api('/api/grid/status'), null, 2);
  } catch (e) {
    document.getElementById('gridStatus').textContent = e.message;
  }
}
async function grid(action) {
  try {
    const d = await api('/api/grid/' + action, 'POST', {});
    document.getElementById('gridStatus').textContent = JSON.stringify(d, null, 2);
    toast('Grid ' + action, 'success');
  } catch (e) {
    toast(e.message, 'error');
  }
}

loadTicker();
loadMm();
loadGrid();
</script>
</body>
</html>
